<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lodestar — compass preview</title>
<!--
  Design harness, not shipped. `CompassRenderer.swift` is the real instrument; this page exists
  because it renders in a browser that can be screenshotted on a Linux box, where AppKit cannot
  build. Numbers here (caseOut, sectorIn, lidOpen, lidDepth, …) are the ones mirrored in
  `CompassMetrics`, and `HINGE_TUNING` is `LidHinge.Tuning`, so if you change the look or the
  feel, change both and re-run the tests.
  Frames: ?freeze=deg (lid held at an angle), ?at=ms (the opening, ms in), ?closeat=ms.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17130e; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hint {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    font: 11px ui-monospace, Menlo, monospace; color: rgba(240,226,196,.34);
    letter-spacing: .16em; text-transform: uppercase; user-select: none;
    pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">move to tilt · 1–9 aim · esc close</div>
<script>
// ---------------------------------------------------------------------------
// Design harness for the compass. Everything here is expressed the way
// RadialCore/Compass.swift and Lodestar/CompassRenderer.swift express it:
// a flat instrument built in centred "card space", tilted by a homography,
// with the lid on its own hinge. Not shipped.
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const FREEZE = Q.has('freeze') ? parseFloat(Q.get('freeze')) : null;
const RADIUS_OVERRIDE = Q.has('r') ? parseFloat(Q.get('r')) : null;
const EYE_OVERRIDE = Q.has('eye') ? parseFloat(Q.get('eye')) : null;
const LID_OVERRIDE = Q.has('lid') ? parseFloat(Q.get('lid')) : null;
const ANGLE_OVERRIDE = Q.has('angle') ? parseFloat(Q.get('angle')) : null;
const LID_PLAIN = Q.has('plain');
// Global wear strength, so the ageing can be dialled in and out without touching every
// individual alpha.
// Launch velocities, matching RadialMenuView.present().
const OPEN_KICK = 4.6;
// The lid is no longer a spring: see LidHinge. How hard the stop shakes the case when it lands:
const IMPACT_TILT = 0.12;
const AT_MS = Q.has('at') ? parseFloat(Q.get('at')) : null;
// `?closeat=ms`: start fully open, push it shut, and hold the gesture ms in.
const CLOSE_AT_MS = Q.has('closeat') ? parseFloat(Q.get('closeat')) : null;
const AGE = Q.has('age') ? parseFloat(Q.get('age')) : 1.3;

const SLICES_DEFAULT = [
  { title: "GitHub",          sub: "github.com" },
  { title: "Hacker News",     sub: "news.ycombinator.com" },
  { title: "Apple Developer", sub: "developer.apple.com" },
  { title: "Swift",           sub: "swift.org" },
  { title: "Linear",          sub: "linear.app" },
  { title: "Figma",           sub: "figma.com" },
  { title: "Dribbble",        sub: "dribbble.com" },
  { title: "Notion",          sub: "notion.so" },
  { title: "Are.na",          sub: "are.na" }
];
// ?names=A,B,C swaps in your own bookmark names, to see how real titles lay out.
const SLICES = Q.has('names')
  ? Q.get('names').split(',').map(t => ({ title: t.trim(), sub: '' }))
  : SLICES_DEFAULT;

// Colours sampled from the reference: warm cream card, tarnished brass, sepia ink.
const C = {
  paper:     '#dccdaa',
  paperLit:  '#e0d1b1',
  paperDeep: '#bda87e',
  paperEdge: '#87704a',
  ink:       '#33261a',
  inkSoft:   '#5d4a34',
  vermilion: '#a13b28',
  // Tarnished brass: the highlights stay warm rather than white, and the darks
  // go olive instead of chocolate, which is the difference between "carried" and
  // "polished this morning".
  brassHi:   '#d5c08f',
  brassLit:  '#b3915a',
  brassMid:  '#856538',
  brassDark: '#5a4325',
  brassDeep: '#2f2717'
};

// Proportions, as multiples of the card radius R.
const P = {
  card:      1.000,
  caseOut:   1.175,
  wall:      0.085,
  top:       0.020,
  hub:       0.185,
  sectorIn:  0.250,
  sectorOut: 0.880,
  scaleIn:   0.895,
  scaleOut:  0.985,
  numeralR:  0.930,   // in a gate cut through the tick ring, on cream
  labelR:    0.63,
  lid:       LID_OVERRIDE || 0.95,    // lid outer radius, as a multiple of the case's: it closes inside the lip, and perspective makes up the difference when it stands
  lidDepth:  0.105,                   // how deep the dish is, so the lid has a wall rather than an edge
  lidWall:   0.045,                   // wall thickness
  lidPlate:  0.018,                   // thickness of the plate that closes the dish
  lidChamfer: 0.040,                  // the shoulder where the cover rolls into the wall
  lidOpen:   ANGLE_OVERRIDE || 120
};

// ── Deterministic wear ─────────────────────────────────────────────────────
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R0 = rng(9157);
const PATINA = Array.from({ length: 30 }, () => {
  const a = R0() * Math.PI * 2;
  const r = 0.94 + R0() * 0.20;
  return { a, r, w: 0.10 + R0() * 0.20, a2: (0.05 + R0() * 0.10) * 1.7 };  // brassPatinaWeight
});
const BUFF = Array.from({ length: 11 }, () => {
  const a = R0() * Math.PI * 2;
  return { a, len: 0.25 + R0() * 0.55, r: 1.02 + R0() * 0.10, a2: (0.06 + R0() * 0.10) * 1.4 };  // buffWeight
});
const AGED = Array.from({ length: 9 }, () => ({
  x: (R0() - 0.5) * 1.4, y: (R0() - 0.5) * 1.4,
  r: 0.16 + R0() * 0.30, a: (0.030 + R0() * 0.045) * 1.9  // broadAgeingWeight
}));
const LID_BLOTCH = Array.from({ length: 7 }, () => {
  const a = R0() * Math.PI * 2, rr = R0() * 0.55;
  return { x: rr * Math.sin(a), y: -rr * Math.cos(a), r: 0.18 + R0() * 0.26, a: (0.035 + R0() * 0.040) * 2.4 };  // lidBlotchWeight
});
const LID_PATINA = Array.from({ length: 17 }, () => {
  const a = R0() * Math.PI * 2, rr = 0.42 + R0() * 0.52;
  return { x: rr * Math.sin(a), y: -rr * Math.cos(a), r: 0.10 + R0() * 0.20, a: (0.04 + R0() * 0.08) * 2.6 };  // lidPatinaWeight
});
const LID_RUST = Array.from({ length: 5 }, () => ({
  x: (R0() - 0.5) * 1.2, y: 0.62 + R0() * 0.30, r: 0.018 + R0() * 0.035, a: 0.12 + R0() * 0.10
}));
const FOXING = Array.from({ length: 22 }, () => ({
  x: (R0() - 0.5) * 1.5, y: (R0() - 0.5) * 1.5,
  r: 0.010 + R0() * 0.045, a: (0.05 + R0() * 0.10) * 1.5  // foxingWeight
}));

// ── Springs, identical integrator to Animation.swift ───────────────────────
class Spring {
  constructor(v, k, d) { this.value = v; this.target = v; this.velocity = 0; this.k = k; this.d = d; }
  get moving() { return Math.abs(this.target - this.value) > 5e-4 || Math.abs(this.velocity) > 5e-4; }
  step(dt) {
    const clamped = Math.min(dt, 0.25);
    const steps = Math.max(1, Math.ceil(clamped / (1 / 240)));
    const h = clamped / steps;
    for (let i = 0; i < steps; i++) {
      this.velocity += (this.k * (this.target - this.value) - this.d * this.velocity) * h;
      this.value += this.velocity * h;
    }
    if (!this.moving) { this.value = this.target; this.velocity = 0; }
    return this.value;
  }
}


// ── The hinge, as a physical thing ─────────────────────────────────────────
// Mirrors RadialCore/LidHinge.swift. The lid is flicked, goes over the top, and falls onto its
// stop: gravity pulls it shut until it passes vertical and open after, so the swing slows near
// the top and then drops. The stop is hard, with a little bounce. Closing is driven, because
// a real lid is pushed shut, and meets the case with a small clack.
const HINGE_TUNING = {
  gravity: 46, friction: 2.5, stopBounce: 0.38, maxBounce: 3.0, shutBounce: 0.16, restSpeed: 0.9,
  pop: 1.5, driveTo: 0.25, drive: 400,
  closeStiffness: 520, closeDamping: 40, closeTarget: -0.07
};
class LidHinge {
  constructor(stop) { this.stop = stop; this.angle = 0; this.velocity = 0; this.mode = 'rest'; this.impact = 0; }
  get moving() { return this.mode !== 'rest' || this.velocity !== 0; }
  release() {
    const T = HINGE_TUNING;
    this.mode = 'opening';
    // Enough to clear vertical from wherever it is, so a reversal can never stall it half open.
    const launch = this.angle < 0.05
      ? T.pop
      : Math.sqrt(Math.max(0, 2 * T.gravity * (1 - Math.sin(this.angle)))) * 1.2 + 2.5;
    this.velocity = Math.max(this.velocity, launch);
  }
  shut() { this.mode = 'closing'; }
  step(dt) {
    const T = HINGE_TUNING;
    this.impact = 0;
    if (this.frozen || this.mode === 'rest') return;
    const n = Math.max(1, Math.ceil(Math.min(dt, 0.25) * 240));
    const h = Math.min(dt, 0.25) / n;
    for (let i = 0; i < n; i++) {
      let acc;
      if (this.mode === 'closing') {
        acc = -T.closeStiffness * (this.angle - T.closeTarget) - T.closeDamping * this.velocity;
      } else {
        acc = -T.gravity * Math.cos(this.angle) - T.friction * this.velocity;
        if (this.angle < T.driveTo) acc += T.drive;
      }
      this.velocity += acc * h;
      this.angle += this.velocity * h;
      if (this.angle >= this.stop) {
        this.angle = this.stop;
        if (this.velocity > T.restSpeed) { this.impact = Math.max(this.impact, this.velocity); this.velocity = -Math.min(T.stopBounce * this.velocity, T.maxBounce); }
        else this.velocity = 0;
      } else if (this.angle <= 0) {
        this.angle = 0;
        if (this.velocity < -T.restSpeed) { this.impact = Math.max(this.impact, -this.velocity); this.velocity = -T.shutBounce * this.velocity; }
        else this.velocity = 0;
      }
    }
    if (this.velocity === 0 && (this.angle === this.stop && this.mode === 'opening' || this.angle === 0 && this.mode === 'closing')) {
      this.mode = 'rest';
    }
  }
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, R = 200;
let O = { x: 0, y: 0 };
let pointer = { x: 0, y: 0 };
let hoveredSlice = null;

const S = {
  open:   new Spring(0, 420, 27),   // matches RadialMenuView.openProgress
  pitch:  new Spring(0, 170, 26),
  roll:   new Spring(0, 170, 26),
  needle: new Spring(0, 300, 26),
  hub:    new Spring(0, 380, 28),
  hover:  SLICES.map(() => new Spring(0, 420, 30))
};

// ── Projection ─────────────────────────────────────────────────────────────
function project(x, y, z) {
  const cr = Math.cos(S.roll.value), sr = Math.sin(S.roll.value);
  const cp = Math.cos(S.pitch.value), sp = Math.sin(S.pitch.value);
  const x1 =  x * cr + z * sr;
  const z1 = -x * sr + z * cr;
  const y1 =  y * cp - z1 * sp;
  const z2 =  y * sp + z1 * cp;
  const d = R * (EYE_OVERRIDE || 8);
  const s = d / (d - z2);
  return { x: x1 * s, y: y1 * s, s, z: z2 };
}

// Single source of truth for the lid's stop, in degrees.
const LID_OPEN_ANGLE = ANGLE_OVERRIDE || P.lidOpen;

let lidAngle = 0;
// The hinge sits on the lid's own rim, at the height of the case's crest. The lid is flush with the
// case, so that is also the case's back edge: the barrel stands out behind it, like a real one.
const HINGE_LIFT = 0;
const HINGE_Y = () => -R * P.caseOut * (P.lid + HINGE_LIFT);
const HINGE_Z = () => R * P.top;

const HINGE = new LidHinge(LID_OPEN_ANGLE * Math.PI / 180);
const TAU = Math.PI * 2;
const step = () => TAU / SLICES.length;
const norm = a => ((a % TAU) + TAU) % TAU;

function ringPts(r, steps, mapper) {
  const out = [];
  for (let i = 0; i <= steps; i++) {
    const a = i / steps * TAU;
    out.push(mapper(r * Math.sin(a), -r * Math.cos(a), 0));
  }
  return out;
}

function tracePath(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
}

function traceLine(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
}

// Two subpaths of opposite winding: fills as an annulus under 'evenodd'.
function annulus(rOuter, rInner, mapper = project) {
  const outer = ringPts(rOuter, 110, mapper);
  const inner = ringPts(rInner, 110, mapper).reverse();
  ctx.beginPath();
  outer.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  inner.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
}

function sectorPts(i, inset, inner, outer, mapper) {
  const half = step() / 2 - inset;
  const c = i * step();
  const pts = [];
  const n = 10;
  for (let k = 0; k <= n; k++) {
    const a = c - half + (2 * half) * k / n;
    pts.push(mapper(outer * Math.sin(a), -outer * Math.cos(a), 0));
  }
  for (let k = n; k >= 0; k--) {
    const a = c - half + (2 * half) * k / n;
    pts.push(mapper(inner * Math.sin(a), -inner * Math.cos(a), 0));
  }
  return pts;
}

// ── Text ───────────────────────────────────────────────────────────────────
function text(str, anchor, o) {
  const s = Math.min(1.07, Math.max(0.93, anchor.s));
  const size = (o.size || 10) * s;
  ctx.save();
  ctx.translate(anchor.x, anchor.y);
  ctx.scale(1, (o.squash || 1) * s);
  ctx.font = `${o.weight || ''} ${size}px ${o.font || 'Georgia, "Times New Roman", serif'}`;
  ctx.fillStyle = o.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (o.tracking) ctx.letterSpacing = `${o.tracking * s}px`;
  if (o.halo) {
    // Pale rim under the ink, so type stays readable where the needle passes beneath it.
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.17;
    ctx.strokeStyle = o.halo;
    ctx.strokeText(str, 0, 0);
  }
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

const SERIF = 'Georgia, "Times New Roman", serif';
const MONO = 'ui-monospace, Menlo, monospace';

// ── Materials ──────────────────────────────────────────────────────────────
let grain = null;
function buildGrain() {
  const size = 96;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size);
  const r = rng(4001);
  for (let i = 0; i < size * size; i++) {
    const v = 128 + (r() - 0.5) * 70;
    img.data[i * 4] = v;
    img.data[i * 4 + 1] = v * 0.96;
    img.data[i * 4 + 2] = v * 0.86;
    img.data[i * 4 + 3] = 20;
  }
  g.putImageData(img, 0, 0);
  grain = ctx.createPattern(c, 'repeat');
}

function grainFill(extent) {
  ctx.save();
  ctx.fillStyle = grain;
  ctx.fillRect(-extent, -extent, extent * 2, extent * 2);
  ctx.restore();
}

// ── Frame ──────────────────────────────────────────────────────────────────
function drawBackdrop() {
  const radius = Math.max(R * 2.6, 460);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
  g.addColorStop(0, 'rgba(19,15,10,0.90)');
  g.addColorStop(0.46, 'rgba(19,15,10,0.62)');
  g.addColorStop(1, 'rgba(19,15,10,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-O.x, -O.y, W, H);
}

function drawContactShadow() {
  const r = R * P.caseOut;
  const g = ctx.createRadialGradient(0, R * 0.14, r * 0.5, 0, R * 0.14, r * 1.5);
  g.addColorStop(0, 'rgba(0,0,0,0.62)');
  g.addColorStop(0.62, 'rgba(0,0,0,0.30)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.scale(0.95, 1.06);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, R * 0.14, r * 1.5, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// ── Lid ────────────────────────────────────────────────────────────────────
// A real lid, not a plate: a shallow brass dish with a milled wall, a chamfered shoulder, a
// flat cover on the outside and the engraved plate on the inside. It is a small mesh in the
// lid's own frame (x right, y toward the case, h up off the case when shut), swung about the
// hinge, then painted far-to-near with the faces that point away from the eye dropped. That
// is what lets it show its cover on the way up, turn edge-on, and come over to show the
// engraving — the flip the flat plate could only fake. Mirrors CompassLid + drawLid in
// CompassRenderer.swift.

// The height above the lid's rim plane that lidPointOf / lidFlatOf currently draw at. The cover and
// the floor are different heights, and both carry art authored in the same lid-plane units.
let LID_H = 0;

const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm3 = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

// Key light from the upper left and toward the viewer. Fill is the pale card throwing warm
// light back up: it is why the inside of a leaning lid glows instead of going to mud.
const KEY  = norm3([-0.42, -0.58, 0.70]);
const FILL = norm3([0.10, 0.78, 0.55]);
const HALF = norm3([KEY[0], KEY[1], KEY[2] + 1]);

function lidDims() {
  const L = R * P.caseOut * P.lid;
  const depth = R * P.lidDepth, wall = R * P.lidWall, plate = R * P.lidPlate, ch = R * P.lidChamfer;
  return { L, depth, wall, plate, ch, floorR: L - wall, floorH: depth - plate, coverR: L - ch };
}

function swingPt(x, y, h) {
  const ca = Math.cos(lidAngle), sa = Math.sin(lidAngle);
  const hy = HINGE_Y(), hz = HINGE_Z();
  const rel = y - hy;
  return [x, hy + rel * ca - h * sa, hz + rel * sa + h * ca];
}

// Camera rotation only (no translation, no perspective), for normals and depth.
let CAM = { cr: 1, sr: 0, cp: 1, sp: 0, d: 800 };
function syncCam() {
  CAM = { cr: Math.cos(S.roll.value), sr: Math.sin(S.roll.value),
          cp: Math.cos(S.pitch.value), sp: Math.sin(S.pitch.value), d: R * (EYE_OVERRIDE || 8) };
}
function camRotate(v) {
  const x1 = v[0] * CAM.cr + v[2] * CAM.sr;
  const z1 = -v[0] * CAM.sr + v[2] * CAM.cr;
  return [x1, v[1] * CAM.cp - z1 * CAM.sp, v[1] * CAM.sp + z1 * CAM.cp];
}
function camScreen(v) {
  const s = CAM.d / (CAM.d - v[2]);
  return { x: v[0] * s, y: v[1] * s, s };
}

function projectLid(x, y, z) {
  const p = swingPt(x, y, z + LID_H);
  return project(p[0], p[1], p[2]);
}
function lidPointOf(a, r) { return projectLid(r * Math.sin(a), -r * Math.cos(a), 0); }
function lidFlatOf(x, y) { return projectLid(x, y, 0); }

// Brass, as a function of how much light a face catches. Warm throughout: the highlights stay
// cream and the shadows go olive rather than grey.
const BRASS_RAMP = [
  [0.00, [26, 19, 10]], [0.22, [58, 44, 24]], [0.42, [96, 74, 40]], [0.60, [133, 101, 56]],
  [0.78, [179, 145, 90]], [0.92, [213, 192, 143]], [1.00, [238, 223, 180]]
];
function brass(i, alpha = 1) {
  i = Math.max(0, Math.min(1, i));
  let k = 1;
  while (k < BRASS_RAMP.length - 1 && BRASS_RAMP[k][0] < i) k++;
  const [t0, c0] = BRASS_RAMP[k - 1], [t1, c1] = BRASS_RAMP[k];
  const u = (i - t0) / (t1 - t0);
  const c = c0.map((v, n) => Math.round(v + (c1[n] - v) * u));
  return alpha >= 1 ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}
function lightOn(n, shine) {
  const kd = Math.max(0, dot3(n, KEY));
  const kf = Math.max(0, dot3(n, FILL));
  const spec = Math.pow(Math.max(0, dot3(n, HALF)), 26);
  return 0.20 + 0.56 * kd + 0.36 * kf + shine * spec;
}

// The lid's mesh, in its own frame. Rebuilt per frame because it follows R.
function buildLidFaces() {
  const d = lidDims();
  const N = 144;
  const pol = (r, a, h) => [r * Math.sin(a), -r * Math.cos(a), h];
  const faces = [];
  for (let i = 0; i < N; i++) {
    const a0 = i / N * TAU, a1 = (i + 1) / N * TAU, am = (a0 + a1) / 2;
    const rx = Math.sin(am), ry = -Math.cos(am);
    const shoulderH = d.depth - d.ch;
    faces.push({ kind: 'wall', i, n: [rx, ry, 0],
      v: [pol(d.L, a0, 0), pol(d.L, a1, 0), pol(d.L, a1, shoulderH), pol(d.L, a0, shoulderH)] });
    faces.push({ kind: 'shoulder', i, n: [rx * 0.707, ry * 0.707, 0.707],
      v: [pol(d.L, a0, shoulderH), pol(d.L, a1, shoulderH), pol(d.coverR, a1, d.depth), pol(d.coverR, a0, d.depth)] });
    faces.push({ kind: 'rim', i, n: [0, 0, -1],
      v: [pol(d.L, a0, 0), pol(d.L, a1, 0), pol(d.floorR, a1, 0), pol(d.floorR, a0, 0)] });
    faces.push({ kind: 'inner', i, n: [-rx, -ry, 0],
      v: [pol(d.floorR, a0, 0), pol(d.floorR, a1, 0), pol(d.floorR, a1, d.floorH), pol(d.floorR, a0, d.floorH)] });
  }
  const ring = (r, h) => Array.from({ length: N }, (_, i) => pol(r, i / N * TAU, h));
  faces.push({ kind: 'cover', n: [0, 0, 1], v: ring(d.coverR, d.depth) });
  faces.push({ kind: 'floor', n: [0, 0, -1], v: ring(d.floorR, d.floorH) });
  return faces;
}

// Places every face: world position, depth, whether it faces the eye, and its screen polygon.
function placeLidFaces(faces) {
  syncCam();
  const out = [];
  for (const f of faces) {
    const view = f.v.map(p => camRotate(swingPt(p[0], p[1], p[2])));
    const c = [0, 0, 0];
    for (const v of view) { c[0] += v[0]; c[1] += v[1]; c[2] += v[2]; }
    c[0] /= view.length; c[1] /= view.length; c[2] /= view.length;
    const sw = swingPt(f.n[0], f.n[1], f.n[2]);
    // Normals are vectors: swing them without the hinge's translation.
    const ca = Math.cos(lidAngle), sa = Math.sin(lidAngle);
    const nv = camRotate([f.n[0], f.n[1] * ca - f.n[2] * sa, f.n[1] * sa + f.n[2] * ca]);
    const toEye = [-c[0], -c[1], CAM.d - c[2]];
    if (dot3(nv, toEye) <= 0) continue;
    f.nv = nv; f.z = c[2];
    f.s = view.map(camScreen);
    out.push(f);
  }
  out.sort((a, b) => a.z - b.z);
  return out;
}

function polyPath(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
}

// Cheap, stable pseudo-noise for the wall, so no two ridges are quite alike.
const wobble = i => { const s = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return s - Math.floor(s); };

function paintLidBand(f) {
  let I = lightOn(f.nv, f.kind === 'shoulder' ? 0.30 : 0.10);
  if (f.kind === 'wall') {
    // Milled edge: alternate ridges, and a little unevenness so it is not a printed pattern.
    I *= (f.i % 2 ? 0.95 : 1.02) * (0.985 + wobble(f.i) * 0.03);
  } else if (f.kind === 'shoulder') {
    I += 0.05;
  } else if (f.kind === 'inner') {
    I *= 0.78;
  } else if (f.kind === 'rim') {
    I *= 0.92;
  }
  const colour = brass(I);
  polyPath(f.s);
  ctx.fillStyle = colour;
  ctx.fill();
  // The same colour as a hairline: adjacent polygons otherwise leave seams of backdrop.
  ctx.strokeStyle = colour;
  ctx.lineWidth = 0.7;
  ctx.stroke();
}

// The line where the lid meets the case, and the lit crest of the shoulder.
function paintLidEdges(faces) {
  const wall = faces.filter(f => f.kind === 'wall');
  const shoulder = faces.filter(f => f.kind === 'shoulder');
  ctx.save();
  ctx.lineCap = 'round';
  for (const f of wall) {
    // Seam against the case: only matters while the lid is down on it.
    ctx.beginPath(); ctx.moveTo(f.s[0].x, f.s[0].y); ctx.lineTo(f.s[1].x, f.s[1].y);
    ctx.strokeStyle = 'rgba(18,12,5,.55)';
    ctx.lineWidth = Math.max(0.9, R * 0.006);
    ctx.stroke();
  }
  for (const f of shoulder) {
    const lit = Math.max(0, Math.min(1, lightOn(f.nv, 0.5) - 0.35));
    ctx.beginPath(); ctx.moveTo(f.s[3].x, f.s[3].y); ctx.lineTo(f.s[2].x, f.s[2].y);
    ctx.strokeStyle = `rgba(255,243,212,${0.10 + 0.55 * lit})`;
    ctx.lineWidth = Math.max(0.8, R * 0.005);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f.s[0].x, f.s[0].y); ctx.lineTo(f.s[1].x, f.s[1].y);
    ctx.strokeStyle = `rgba(255,236,196,${0.06 + 0.30 * lit})`;
    ctx.stroke();
  }
  ctx.restore();
}

function polyBounds(pts) {
  return pts.reduce((a, p) => ({
    x0: Math.min(a.x0, p.x), y0: Math.min(a.y0, p.y), x1: Math.max(a.x1, p.x), y1: Math.max(a.y1, p.y)
  }), { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 });
}

function blot(p, rr, stops) {
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
  stops.forEach(([t, c]) => g.addColorStop(t, c));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, TAU); ctx.fill();
}

// The outside of the lid: a spun cover with a rolled border, a thumb-polished patch where the
// hand takes it, and the tarnish a cover collects from a century in a pocket.
function paintLidCover(f) {
  const d = lidDims();
  const rad = d.coverR;
  LID_H = d.depth;
  const I = lightOn(f.nv, 0.24);
  const bb = polyBounds(f.s);
  const centre = { x: (bb.x0 + bb.x1) / 2, y: (bb.y0 + bb.y1) / 2 };

  ctx.save();
  polyPath(f.s);
  ctx.fillStyle = brass(I);
  ctx.fill();
  ctx.clip();

  // Spun finish.
  for (let i = 0; i < 30; i++) {
    const t = i / 30;
    traceLine(ringPts(rad * (0.10 + 0.88 * t), 72, projectLid));
    ctx.strokeStyle = i % 2 ? `rgba(255,247,224,${0.040 * (1 - t * 0.5)})` : `rgba(30,22,11,${0.050 * (1 - t * 0.5)})`;
    ctx.lineWidth = Math.max(0.6, rad * 0.0036);
    ctx.stroke();
  }
  // Sheen follows the light across the plate as it turns.
  const lit = lidFlatOf(-rad * 0.38, -rad * 0.34);
  const sheen = ctx.createRadialGradient(lit.x, lit.y, rad * 0.03, lit.x, lit.y, rad * 1.05);
  sheen.addColorStop(0, 'rgba(255,246,220,.22)');
  sheen.addColorStop(0.45, 'rgba(255,246,220,.05)');
  sheen.addColorStop(1, 'rgba(20,14,7,.16)');
  ctx.fillStyle = sheen;
  ctx.fillRect(bb.x0, bb.y0, bb.x1 - bb.x0, bb.y1 - bb.y0);

  // Rolled border and a central roundel.
  [['rgba(0,0,0,.30)', 1.1, 0.900], ['rgba(255,250,235,.16)', 0.8, 0.885], ['rgba(0,0,0,.20)', 0.9, 0.300],
   ['rgba(255,250,235,.12)', 0.8, 0.288]].forEach(([c, w, k]) => {
    traceLine(ringPts(rad * k, 96, projectLid));
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke();
  });
  const boss = lidFlatOf(0, 0);
  blot(boss, rad * 0.10, [[0, 'rgba(255,244,214,.16)'], [0.6, 'rgba(120,96,56,.10)'], [1, 'rgba(30,20,8,.20)']]);

  // Thumb polish at the front edge.
  blot(lidPointOf(Math.PI, rad * 0.80), rad * 0.36,
    [[0, 'rgba(255,246,220,.20)'], [0.5, 'rgba(255,246,220,.07)'], [1, 'rgba(255,246,220,0)']]);

  // Tarnish.
  // Lighter than the inside: this is the side that gets handled and wiped.
  LID_BLOTCH.forEach(b => blot(lidFlatOf(-b.x * rad, b.y * rad), b.r * rad * 1.3,
    [[0, `rgba(74,72,50,${Math.min(1, b.a * AGE * 0.38)})`], [1, 'rgba(74,72,50,0)']]));
  LID_PATINA.forEach(b => blot(lidFlatOf(-b.x * rad, -b.y * rad), b.r * rad * 1.15,
    [[0, `rgba(74,72,50,${Math.min(1, b.a * AGE * 0.45)})`], [0.52, `rgba(74,72,50,${Math.min(1, b.a * 0.5 * AGE * 0.45)})`], [1, 'rgba(74,72,50,0)']]));

  // Edge vignette: the cover rolls over into its shoulder.
  const vig = ctx.createRadialGradient(centre.x, centre.y, rad * 0.6, centre.x, centre.y, rad * 1.04);
  vig.addColorStop(0, 'rgba(24,17,9,0)');
  vig.addColorStop(1, 'rgba(24,17,9,.30)');
  ctx.fillStyle = vig;
  ctx.fillRect(bb.x0, bb.y0, bb.x1 - bb.x0, bb.y1 - bb.y0);
  ctx.restore();
}

// The inside of the lid: the engraved plate. Lit mostly by the card below it.
function paintLidFloor(f) {
  const d = lidDims();
  const rad = d.floorR;
  LID_H = d.floorH;
  const I = lightOn(f.nv, 0.10) * 0.94;
  const rim = f.s;
  const bb = polyBounds(rim);
  const centre = { x: (bb.x0 + bb.x1) / 2, y: (bb.y0 + bb.y1) / 2 };

  ctx.save();
  polyPath(rim);
  ctx.fillStyle = brass(I);
  ctx.fill();
  ctx.clip();

  // Depth: the plate is darker toward the far end of the dish, which is further from the card's glow.
  const face = ctx.createLinearGradient(0, bb.y1, 0, bb.y0);
  face.addColorStop(0.0, 'rgba(255,240,200,.05)');
  face.addColorStop(0.55, 'rgba(40,28,12,.00)');
  face.addColorStop(1.0, 'rgba(28,19,8,.30)');
  ctx.fillStyle = face;
  ctx.fillRect(bb.x0, bb.y0, bb.x1 - bb.x0, bb.y1 - bb.y0);

  // Turned finish: bands rather than rings. A spun surface catches light on each ridge.
  for (let i = 0; i < 26; i++) {
    const t = i / 26;
    const rr = rad * (0.16 + 0.82 * Math.pow(t, 0.86));
    const fade = 1 - t * 0.55;
    traceLine(ringPts(rr, 72, projectLid));
    ctx.strokeStyle = i % 2 ? `rgba(255,247,224,${0.030 * fade})` : `rgba(30,22,11,${0.045 * fade})`;
    ctx.lineWidth = Math.max(0.6, rad * 0.0038);
    ctx.stroke();
  }
  [[0.30, 0.52, .05], [0.55, 0.86, .04], [0.74, 0.97, .035]].forEach(([a0, a1, al]) => {
    const arc = [];
    for (let i = 0; i <= 40; i++) arc.push(lidPointOf(a0 + (a1 - a0) * i / 40, rad * 0.90));
    traceLine(arc);
    ctx.strokeStyle = `rgba(255,248,228,${al})`;
    ctx.lineWidth = rad * 0.010;
    ctx.stroke();
  });

  // The card's glow, pooled low in the plate, and a soft shoulder into the wall.
  const glow = ctx.createRadialGradient(centre.x, bb.y1 - (bb.y1 - bb.y0) * 0.18, rad * 0.05,
                                        centre.x, centre.y, Math.max(bb.x1 - bb.x0, bb.y1 - bb.y0) * 0.62);
  glow.addColorStop(0, 'rgba(255,238,200,.15)');
  glow.addColorStop(0.5, 'rgba(255,238,200,.04)');
  glow.addColorStop(1, 'rgba(20,14,7,.10)');
  ctx.fillStyle = glow;
  ctx.fillRect(bb.x0, bb.y0, bb.x1 - bb.x0, bb.y1 - bb.y0);
  const vig = ctx.createRadialGradient(centre.x, centre.y, rad * 0.55, centre.x, centre.y, rad * 1.02);
  vig.addColorStop(0, 'rgba(24,17,9,0)');
  vig.addColorStop(0.72, 'rgba(24,17,9,.10)');
  vig.addColorStop(1, 'rgba(24,17,9,.38)');
  ctx.fillStyle = vig;
  ctx.fillRect(bb.x0, bb.y0, bb.x1 - bb.x0, bb.y1 - bb.y0);

  [['rgba(0,0,0,.30)', 1.1, 0.855], ['rgba(0,0,0,.22)', 0.9, 0.815], ['rgba(255,250,235,.13)', 0.8, 0.800]].forEach(([c, w, k]) => {
    traceLine(ringPts(rad * k, 96, projectLid));
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke();
  });

  drawLidRose(rad);

  const mark = lidFlatOf(0, rad * 0.705);
  text('SAFARI  RADIAL', { x: mark.x, y: mark.y, s: Math.min(1, Math.max(0.62, Math.abs(Math.cos(lidAngle)) + 0.55)) }, {
    size: Math.max(5.2, rad * 0.044), font: SERIF, color: 'rgba(26,18,9,.34)', weight: '600', tracking: 1.2
  });

  // Even tarnish, then the broad mottling and the sharper patina.
  const tann = ctx.createRadialGradient(centre.x, centre.y, rad * 0.10, centre.x, centre.y, rad * 1.02);
  tann.addColorStop(0, 'rgba(96,74,40,0.02)');
  tann.addColorStop(0.55, 'rgba(88,66,36,0.10)');
  tann.addColorStop(0.86, 'rgba(76,56,30,0.20)');
  tann.addColorStop(1, 'rgba(58,44,24,0.30)');
  ctx.fillStyle = tann;
  ctx.fillRect(bb.x0, bb.y0, bb.x1 - bb.x0, bb.y1 - bb.y0);

  LID_BLOTCH.forEach(b => blot(lidFlatOf(b.x * rad, b.y * rad), b.r * rad * 1.1,
    [[0, `rgba(74,72,50,${Math.min(1, b.a * AGE)})`], [1, 'rgba(74,72,50,0)']]));
  LID_PATINA.forEach(b => blot(lidFlatOf(b.x * rad, b.y * rad), b.r * rad * 1.15,
    [[0, `rgba(74,72,50,${Math.min(1, b.a * AGE)})`], [0.52, `rgba(74,72,50,${Math.min(1, b.a * 0.5 * AGE)})`], [1, 'rgba(74,72,50,0)']]));

  // Rust creeps from the hinge seam toward the plate.
  blot(lidPointOf(Math.PI, rad), rad * 0.52,
    [[0, 'rgba(122,62,30,0.30)'], [0.30, 'rgba(122,62,30,0.13)'], [0.62, 'rgba(122,62,30,0.04)'], [1, 'rgba(122,62,30,0)']]);
  LID_RUST.forEach(b => blot(lidFlatOf(b.x * rad, b.y * rad), b.r * rad,
    [[0, `rgba(115,59,30,${b.a})`], [0.5, `rgba(115,59,30,${b.a * 0.5})`], [1, 'rgba(115,59,30,0)']]));
  ctx.restore();
}

// Ambient occlusion where the lid meets the case. Kept for the open pose: a leaning lid
// still darkens the brass under its hinge, and without it the lid reads as hovering.
function drawLidShadow() {
  const sa = Math.sin(lidAngle);
  if (sa < 0.12) return;
  const near = Math.min(1, (sa - 0.12) / 0.6);
  const rad = R * P.caseOut;
  const hinge = project(0, HINGE_Y(), 0);
  const top = hinge.y - rad * 0.02;
  ctx.save();
  tracePath(ringPts(rad, 96, project));
  ctx.clip();
  const g = ctx.createLinearGradient(0, top, 0, top + rad * 0.30);
  g.addColorStop(0, `rgba(24,16,8,${0.34 * near})`);
  g.addColorStop(0.45, `rgba(24,16,8,${0.14 * near})`);
  g.addColorStop(1, 'rgba(24,16,8,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-rad, top, rad * 2, rad * 0.36);
  ctx.restore();
}

// The shadow the lid throws on the case as it swings over it. Cast along the key light onto
// the case's top plane, so it is attached at the hinge, slides across the dial as the lid
// rises, and shortens to nothing as the lid stands up.
function hull2(points) {
  const pts = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const p of pts) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}
function drawLidCastShadow() {
  if (lidAngle < 0.04) return;
  const d = lidDims();
  const crest = HINGE_Z();
  const drift = [0.34, 0.46];
  const pts = [];
  for (const h of [0, d.depth]) {
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * TAU;
      const w = swingPt(d.L * Math.sin(a), -d.L * Math.cos(a), h);
      const up = Math.max(0, w[2] - crest);
      const q = project(w[0] + drift[0] * up, w[1] + drift[1] * up, crest);
      pts.push({ x: q.x, y: q.y });
    }
  }
  const poly = hull2(pts);
  const cx = poly.reduce((s, p) => s + p.x, 0) / poly.length;
  const cy = poly.reduce((s, p) => s + p.y, 0) / poly.length;
  // Fades as the lid lifts clear: a high lid throws a faint, wide shadow.
  const fade = Math.max(0, 1 - Math.max(0, lidAngle - 0.35) / 1.15);
  ctx.save();
  tracePath(ringPts(R * P.caseOut, 96, (x, y) => project(x, y, R * P.top)));
  ctx.clip();
  for (let k = 0; k < 5; k++) {
    const grow = 1 + k * 0.035;
    ctx.beginPath();
    poly.forEach((p, i) => {
      const x = cx + (p.x - cx) * grow, y = cy + (p.y - cy) * grow;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = `rgba(14,9,4,${0.085 * fade})`;
    ctx.fill();
  }
  ctx.restore();
}

function drawLid() {
  const faces = placeLidFaces(buildLidFaces());
  // Bands first and discs where depth puts them; the discs are the two big faces.
  for (const f of faces) {
    if (f.kind === 'cover') paintLidCover(f);
    else if (f.kind === 'floor') paintLidFloor(f);
    else paintLidBand(f);
  }
  paintLidEdges(faces);
}

// An engraved compass rose: a cut circle, eight points alternating long and
// short, each a shadow with a thin light edge, and a struck boss where they meet.
function drawLidRose(rad) {
  const outer = rad * 0.555;
  const waist = rad * 0.125;

  // The rose is the lid's whole reason for existing: a blank plate reads as a
  // lid, a rose reads as an instrument. Cut deep, so it survives being seen at a
  // shallow angle.
  // The plate the rose is cut into sits a hair proud of the field, and a touch lighter.
  // Without this the points have nothing to be raised *above* and read as a drawing on a
  // disc rather than as struck metal.
  {
    const c0 = lidPointOf(0, 0);
    const plate = ctx.createRadialGradient(c0.x, c0.y, 0, c0.x, c0.y, outer * 1.06);
    plate.addColorStop(0, 'rgba(226,206,166,.10)');
    plate.addColorStop(0.7, 'rgba(214,192,150,.05)');
    plate.addColorStop(1, 'rgba(180,156,112,0)');
    traceLine(ringPts(outer * 1.06, 96, projectLid));
    ctx.fillStyle = plate;
    ctx.fill();
  }
  for (let i = 0; i < 4; i++) {
    rosePoint(i / 4 * TAU, outer, waist * 0.68, 0.52, 0.34);
  }
  for (let i = 0; i < 4; i++) {
    rosePoint(i / 4 * TAU + Math.PI / 4, outer * 0.62, waist * 0.62, 0.40, 0.24);
  }

  // Central boss. Every point's spine converges here, and without a struck disc over
  // the crossing the middle of the rose reads as a tangle of lines.
  {
    const b = lidPointOf(0, 0);
    const rb = rad * 0.072;
    const g = ctx.createRadialGradient(b.x - rb * 0.3, b.y - rb * 0.3, rb * 0.1,
                                       b.x, b.y, rb);
    g.addColorStop(0, 'rgba(198,170,116,0.55)');
    g.addColorStop(0.65, 'rgba(120,96,56,0.45)');
    g.addColorStop(1, 'rgba(46,34,18,0.55)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, rb, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(24,16,8,.40)';
    ctx.lineWidth = Math.max(0.9, rad * 0.009);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x, b.y - rb * 0.10, rb * 0.98, Math.PI, TAU);
    ctx.strokeStyle = 'rgba(255,248,230,.16)';
    ctx.lineWidth = Math.max(0.7, rad * 0.006);
    ctx.stroke();
  }

  // Cut circle the points sit inside.
  traceLine(ringPts(outer * 1.045, 96, projectLid));
  ctx.strokeStyle = 'rgba(24,16,8,.34)'; ctx.lineWidth = Math.max(1.0, rad * 0.012); ctx.stroke();
  traceLine(ringPts(outer * 1.020, 96, projectLid));
  ctx.strokeStyle = 'rgba(255,248,230,.14)'; ctx.lineWidth = Math.max(0.8, rad * 0.008); ctx.stroke();


  // Degree ticks in the rim, between the rose and the border.
  for (let i = 0; i < 72; i++) {
    const a = i / 72 * TAU;
    const long = i % 9 === 0;
    const r0 = rad * 0.905, r1 = rad * (long ? 0.845 : 0.872);
    const p0 = lidPointOf(a, r0), p1 = lidPointOf(a, r1);
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
    ctx.strokeStyle = long ? 'rgba(24,16,8,.40)' : 'rgba(24,16,8,.24)';
    ctx.lineWidth = long ? Math.max(1.0, rad * 0.010) : Math.max(0.7, rad * 0.006);
    ctx.stroke();
  }
}

// One point of the rose, faceted down its spine: one half catches the light, the
// other holds shadow. Without the split it is just a drawn star.
function rosePoint(a, tipR, waistR, dark, lit) {
  const apex = lidPointOf(a, tipR);
  const l = lidPointOf(a - Math.PI / 2, waistR);
  const r = lidPointOf(a + Math.PI / 2, waistR);
  const spine = lidPointOf(a, waistR * 0.35);

  ctx.beginPath();
  ctx.moveTo(spine.x, spine.y); ctx.lineTo(apex.x, apex.y); ctx.lineTo(l.x, l.y);
  ctx.closePath();
  ctx.fillStyle = `rgba(255,246,222,${lit * 0.55})`;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(spine.x, spine.y); ctx.lineTo(apex.x, apex.y); ctx.lineTo(r.x, r.y);
  ctx.closePath();
  ctx.fillStyle = `rgba(24,16,8,${dark * 0.75})`;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(l.x, l.y); ctx.lineTo(apex.x, apex.y); ctx.lineTo(r.x, r.y);
  ctx.strokeStyle = 'rgba(20,13,6,.46)';
  ctx.lineWidth = Math.max(0.8, tipR * 0.012);
  ctx.stroke();

}

function drawCaseWall() {
  const outer = R * P.caseOut;
  const n = 72;
  const band = [];
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU;
    band.push(project(outer * Math.sin(a), -outer * Math.cos(a), -R * P.wall));
  }
  for (let i = n; i >= 0; i--) {
    const a = i / n * TAU;
    band.push(project(outer * Math.sin(a), -outer * Math.cos(a), R * P.top));
  }
  tracePath(band);
  const g = ctx.createLinearGradient(-outer, -outer, outer, outer);
  g.addColorStop(0, '#3a2a15');
  g.addColorStop(0.35, '#57401f');
  g.addColorStop(0.7, '#2e2110');
  g.addColorStop(1, '#1c1409');
  ctx.fillStyle = g;
  ctx.fill();
}

function drawBrass() {
  const outer = R * P.caseOut;
  const inner = R * P.card;

  annulus(outer, inner);
  const g = ctx.createLinearGradient(-outer * 0.72, -outer * 0.78, outer * 0.72, outer * 0.78);
  g.addColorStop(0.00, C.brassLit);
  g.addColorStop(0.18, C.brassMid);
  g.addColorStop(0.46, C.brassLit);
  g.addColorStop(0.70, C.brassMid);
  g.addColorStop(0.88, C.brassDark);
  g.addColorStop(1.00, C.brassDeep);
  ctx.fillStyle = g;
  ctx.fill('evenodd');

  ctx.save();
  annulus(outer, inner);
  ctx.clip('evenodd');

  grainFill(R * 1.5);

  PATINA.forEach(b => {
    const p = project(b.r * R * Math.sin(b.a), -b.r * R * Math.cos(b.a), R * P.top);
    const rr = b.w * R * p.s;
    const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
    gg.addColorStop(0, 'rgba(74,72,50,1)');
    gg.addColorStop(0.6, 'rgba(88,80,52,0.55)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = Math.min(1, b.a2 * AGE);
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rr, 0, TAU);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  BUFF.forEach(b => {
    const p0 = project(b.r * R * Math.sin(b.a), -b.r * R * Math.cos(b.a), R * P.top);
    const p1 = project(b.r * R * Math.sin(b.a + b.len), -b.r * R * Math.cos(b.a + b.len), R * P.top);
    ctx.save();
    ctx.globalAlpha = Math.min(1, b.a2 * AGE);
    ctx.strokeStyle = C.brassHi;
    ctx.lineWidth = Math.max(1.4, R * 0.012);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
    ctx.restore();
  });

  const ridges = 190;
  for (let i = 0; i < ridges; i++) {
    const a = i / ridges * TAU;
    const r0 = outer * 0.952, r1 = outer;
    const p0 = project(r0 * Math.sin(a), -r0 * Math.cos(a), R * P.top);
    const p1 = project(r1 * Math.sin(a), -r1 * Math.cos(a), R * P.top);
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.strokeStyle = i % 2 ? 'rgba(252,240,212,.15)' : 'rgba(38,26,12,.22)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  const sheen = ctx.createLinearGradient(-outer, -outer, -outer * 0.1, -outer * 0.05);
  sheen.addColorStop(0, 'rgba(255,244,208,.16)');
  sheen.addColorStop(1, 'rgba(255,246,218,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(-outer, -outer, outer * 2, outer * 2);

  // Age on the brass: a broad warm bloom over the whole band, then the olive film that
  // concentrates at the rim where a hand never reaches.
  const ageWarm = ctx.createRadialGradient(0, 0, inner * 0.85, 0, 0, outer * 1.02);
  ageWarm.addColorStop(0, 'rgba(104,74,38,.05)');
  ageWarm.addColorStop(0.55, 'rgba(104,74,38,.09)');
  ageWarm.addColorStop(1, 'rgba(96,66,32,.14)');
  ctx.fillStyle = ageWarm;
  ctx.fillRect(-outer, -outer, outer * 2, outer * 2);

  const film = ctx.createRadialGradient(0, 0, outer * 0.86, 0, 0, outer);
  film.addColorStop(0, 'rgba(68,64,44,0)');
  film.addColorStop(0.82, 'rgba(68,64,44,.16)');
  film.addColorStop(1, 'rgba(58,54,38,.34)');
  ctx.fillStyle = film;
  ctx.fillRect(-outer, -outer, outer * 2, outer * 2);

  // Hands: the two arcs that get wiped clean every time the box is held.
  [[0.52, 0.86], [1.42, 1.62]].forEach(([a0, a1]) => {
    const arc = [];
    for (let i = 0; i <= 40; i++) {
      const a = (a0 + (a1 - a0) * i / 40) * Math.PI;
      arc.push(project(outer * 0.975 * Math.sin(a), -outer * 0.975 * Math.cos(a), 0));
    }
    traceLine(arc);
    ctx.strokeStyle = 'rgba(232,208,158,.15)';
    ctx.lineWidth = outer * 0.075;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.lineCap = 'butt';
  });

  ctx.restore();

  tracePath(ringPts(outer, 110, project));
  ctx.strokeStyle = 'rgba(30,21,10,.62)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  tracePath(ringPts(inner, 110, project));
  ctx.strokeStyle = 'rgba(30,21,10,.50)';
  ctx.lineWidth = 1.3;
  ctx.stroke();

  tracePath(ringPts(inner * 0.986, 110, project));
  ctx.strokeStyle = 'rgba(252,240,212,.14)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ── Lanyard lug and hinge ──────────────────────────────────────────────────
// Both are built in card space and projected, so they cannot drift off the case.
function drawLug() {
  const outer = R * P.caseOut;
  const w = R * 0.070;
  const top = outer - R * 0.055;
  const stemEnd = outer + R * 0.070;
  const z = -R * P.wall * 0.45;

  const bowCy = outer + R * 0.128;
  const bowR = R * 0.062;

  ctx.save();
  tracePath([
    project(-w, top, z), project(w, top, z),
    project(w * 0.78, stemEnd, z), project(-w * 0.78, stemEnd, z)
  ]);
  const sg = ctx.createLinearGradient(-w, 0, w, 0);
  sg.addColorStop(0, '#4a3418');
  sg.addColorStop(0.28, C.brassLit);
  sg.addColorStop(0.60, C.brassMid);
  sg.addColorStop(1, '#3f2d14');
  ctx.fillStyle = sg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(28,19,9,.55)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const bow = [];
  for (let i = 0; i <= 64; i++) {
    const a = i / 64 * TAU;
    bow.push(project(bowR * Math.sin(a), bowCy - bowR * Math.cos(a), z));
  }
  tracePath(bow);
  ctx.lineWidth = R * 0.020;
  const bg = ctx.createLinearGradient(-bowR, bowCy - bowR, bowR, bowCy + bowR);
  bg.addColorStop(0, '#3d2c14');
  bg.addColorStop(0.28, C.brassHi);
  bg.addColorStop(0.55, C.brassMid);
  bg.addColorStop(1, '#3a2a13');
  ctx.strokeStyle = bg;
  ctx.stroke();

  const hl = [];
  for (let i = 0; i <= 24; i++) {
    const a = -Math.PI * 0.75 + (Math.PI * 0.9) * i / 24;
    hl.push(project((bowR + R * 0.004) * Math.sin(a), bowCy - (bowR + R * 0.004) * Math.cos(a), z));
  }
  traceLine(hl);
  ctx.strokeStyle = 'rgba(252,242,216,.42)';
  ctx.lineWidth = 1.1;
  ctx.stroke();
  ctx.restore();
}

// The hinge barrel across the back of the case. It is what makes the lid read as hung on the
// box rather than hovering over it. Five knuckles on one pin, alternately the case's and the
// lid's, drawn after the lid because the lid is what turns about them.
function drawHinge() {
  const y = HINGE_Y();
  const z = HINGE_Z();
  const rr = R * 0.040;
  const span = R * 0.34;
  const edges = [-span, -span * 0.6, -span * 0.2, span * 0.2, span * 0.6, span];
  for (let k = 0; k < 5; k++) {
    const x0 = edges[k] + R * 0.004, x1 = edges[k + 1] - R * 0.004;
    const a = project(x0, y, z), b = project(x1, y, z);
    const half = rr * (a.s + b.s) / 2;
    const ownedByLid = k % 2 === 1;
    // A capsule along the pin, shaded like a cylinder lit from above.
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - half);
    ctx.lineTo(b.x, b.y - half);
    ctx.arc(b.x, b.y, half, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(a.x, a.y + half);
    ctx.arc(a.x, a.y, half, Math.PI / 2, Math.PI * 1.5);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, a.y - half, 0, a.y + half);
    g.addColorStop(0, ownedByLid ? '#e2cd98' : C.brassHi);
    g.addColorStop(0.35, ownedByLid ? C.brassLit : C.brassLit);
    g.addColorStop(0.7, C.brassMid);
    g.addColorStop(1, C.brassDeep);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(24,16,8,.55)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
    // Rust on the knuckles themselves, where water sits.
    const mid = project((x0 + x1) / 2, y, z);
    const rg = ctx.createRadialGradient(mid.x, mid.y, 0, mid.x, mid.y, R * 0.07);
    rg.addColorStop(0, 'rgba(82,45,25,.34)');
    rg.addColorStop(0.5, 'rgba(115,59,30,.14)');
    rg.addColorStop(1, 'rgba(115,59,30,0)');
    ctx.save();
    ctx.translate(mid.x, mid.y); ctx.scale(1.5, 0.7); ctx.translate(-mid.x, -mid.y);
    ctx.fillStyle = rg;
    ctx.fillRect(mid.x - R * 0.12, mid.y - R * 0.12, R * 0.24, R * 0.24);
    ctx.restore();
  }
  // The pin's end caps.
  [-span - R * 0.004, span + R * 0.004].forEach(x => {
    const p = project(x, y, z);
    ctx.beginPath();
    ctx.arc(p.x, p.y, rr * p.s * 0.62, 0, TAU);
    ctx.fillStyle = C.brassDark;
    ctx.fill();
    ctx.strokeStyle = 'rgba(24,16,8,.6)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  });
}

// ── Card ───────────────────────────────────────────────────────────────────
function drawCard() {
  const r = R * P.card;

  ctx.save();
  tracePath(ringPts(r, 110, project));
  ctx.clip();

  const g = ctx.createRadialGradient(-r * 0.30, -r * 0.36, r * 0.06, 0, 0, r * 1.04);
  g.addColorStop(0.00, C.paperLit);
  g.addColorStop(0.34, C.paper);
  g.addColorStop(0.68, C.paperDeep);
  g.addColorStop(0.90, '#a08b60');
  g.addColorStop(1.00, C.paperEdge);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.1, 0, TAU);
  ctx.fill();

  grainFill(R * 1.2);

  FOXING.forEach(f => {
    const p = project(f.x * R, f.y * R, R * P.top);
    const rr = f.r * R * p.s;
    const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
    gg.addColorStop(0, 'rgba(122,94,54,1)');
    gg.addColorStop(1, 'rgba(122,94,54,0)');
    ctx.globalAlpha = Math.min(1, f.a * AGE);
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rr, 0, TAU);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Rub ring: a century of the lid closing on the same spot has polished the
  // paper just outside the hub.
  const rub = ctx.createRadialGradient(0, 0, r * 0.22, 0, 0, r * 0.46);
  rub.addColorStop(0, 'rgba(246,238,214,0.10)');
  rub.addColorStop(0.5, 'rgba(246,238,214,0.05)');
  rub.addColorStop(1, 'rgba(246,238,214,0)');
  ctx.fillStyle = rub;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.46, 0, TAU);
  ctx.fill();

  // Grime where the card has sat against the brass for decades: dark all the way
  // round the seat, heaviest at the bottom where dust settles.
  const seat = ctx.createRadialGradient(0, 0, r * 0.80, 0, R * 0.05, r * 1.02);
  seat.addColorStop(0, 'rgba(96,72,40,0)');
  seat.addColorStop(0.72, 'rgba(96,72,40,0.10)');
  seat.addColorStop(1, 'rgba(76,54,28,0.30)');
  ctx.fillStyle = seat;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.05, 0, TAU);
  ctx.fill();

  // Two tide lines: age where a drop of water once dried.
  [[0.62, -0.55, 0.30, 0.75], [-0.70, 0.30, 0.20, 0.60]].forEach(([x, y, rr, a]) => {
    const p = project(x * R, y * R, R * P.top);
    const g2 = ctx.createRadialGradient(p.x, p.y, rr * R * 0.82, p.x, p.y, rr * R);
    g2.addColorStop(0, 'rgba(120,92,52,0)');
    g2.addColorStop(0.85, `rgba(120,92,52,${0.05 * a})`);
    g2.addColorStop(1, `rgba(110,84,46,${0.16 * a})`);
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rr * R * p.s, 0, TAU);
    ctx.fill();
  });

  // Uneven ageing: broad, very soft blotches so the paper is never one flat tone.
  AGED.forEach(b => {
    const p = project(b.x * R, b.y * R, R * P.top);
    const rr = b.r * R * p.s;
    const g2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
    g2.addColorStop(0, 'rgba(112,80,42,1)');
    g2.addColorStop(1, 'rgba(112,80,42,0)');
    ctx.globalAlpha = Math.min(1, b.a * AGE);
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rr, 0, TAU);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawCardPrinting() {
  const z = R * P.top;

  for (let i = 0; i < 8; i++) {
    traceLine(ringPts(R * (P.sectorOut + 0.005 + i * 0.0075), 120, project));
    ctx.strokeStyle = `rgba(74,56,32,${0.16 - i * 0.012})`;
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }

  // The tick ring is interrupted at each slot bearing so its numeral has a clean
  // cream gate to sit in — exactly how a printed compass card handles it.
  const gateHalf = (step() * 180 / Math.PI) * 0.30;
  for (let deg = 0; deg < 360; deg += 5) {
    const a = deg * Math.PI / 180;
    let inGate = false;
    for (let i = 0; i < SLICES.length; i++) {
      let d = Math.abs(deg - i * step() * 180 / Math.PI) % 360;
      d = Math.min(d, 360 - d);
      if (d < gateHalf) { inGate = true; break; }
    }
    if (inGate) continue;
    const long = deg % 15 === 0;
    const r0 = R * (long ? P.scaleIn + 0.008 : P.scaleIn + 0.032);
    const r1 = R * P.scaleOut;
    traceLine([
      project(r0 * Math.sin(a), -r0 * Math.cos(a), z),
      project(r1 * Math.sin(a), -r1 * Math.cos(a), z)
    ]);
    ctx.strokeStyle = long ? 'rgba(58,44,26,.55)' : 'rgba(58,44,26,.26)';
    ctx.lineWidth = long ? 1.05 : 0.7;
    ctx.stroke();
  }

  for (let i = 0; i < SLICES.length; i++) {
    const a = i * step() - step() / 2;
    [[1.7, 'rgba(252,244,222,.40)', 1.25], [0, 'rgba(52,38,22,.40)', 1.1]].forEach(([yOff, col, w]) => {
      traceLine([
        project(R * (P.hub + 0.02) * Math.sin(a), -R * (P.hub + 0.02) * Math.cos(a) + yOff, z),
        project(R * P.sectorOut * Math.sin(a), -R * P.sectorOut * Math.cos(a) + yOff, z)
      ]);
      ctx.strokeStyle = col;
      ctx.lineWidth = w;
      ctx.stroke();
    });
  }

  // Slot numerals: large, dark, in their gates. These are the loudest ink on the
  // card because they are the keyboard target.
  for (let i = 0; i < SLICES.length; i++) {
    const a = i * step();
    const h = Math.max(0, Math.min(1, S.hover[i].value));
    const anchor = project(R * P.numeralR * Math.sin(a), -R * P.numeralR * Math.cos(a), z);
    text(String(i + 1), anchor, {
      size: Math.max(9, R * 0.072),
      font: SERIF,
      weight: '600',
      color: h > 0.3 ? C.vermilion : 'rgba(40,28,14,.94)'
    });
  }

  // Quadrant pips between the sectors, printed on the card.
  [45, 135, 225, 315].forEach(deg => {
    const a = deg * Math.PI / 180;
    const anchor = project(R * 0.955 * Math.sin(a), -R * 0.955 * Math.cos(a), z);
    text('·', anchor, { size: 10, font: SERIF, color: 'rgba(58,44,26,.50)' });
  });
}

function drawSectorWash() {
  for (let i = 0; i < SLICES.length; i++) {
    const h = Math.max(0, Math.min(1, S.hover[i].value));
    if (h < 0.008) continue;
    const pts = sectorPts(i, step() * 0.045, R * P.sectorIn, R * P.sectorOut, project);
    tracePath(pts);
    const g = ctx.createRadialGradient(0, 0, R * P.sectorIn, 0, 0, R * P.sectorOut);
    g.addColorStop(0, `rgba(206,164,86,${0.30 * h})`);
    g.addColorStop(0.62, `rgba(216,180,108,${0.24 * h})`);
    g.addColorStop(1, `rgba(230,200,140,${0.10 * h})`);
    ctx.fillStyle = g;
    ctx.fill();
  }
}

// Point inside the painted part of a wedge? Same test as RadialLayout.sliceContains.
function sliceContains(px, py, index, inset) {
  const r = Math.hypot(px, py);
  if (r < R * P.sectorIn + inset || r > R * P.sectorOut - inset) return false;
  const a = norm(Math.atan2(px, -py));
  const c = norm(index * step());
  let d = Math.abs(a - c);
  d = Math.min(d, TAU - d);
  return d <= Math.max(0, step() / 2 - inset / Math.max(r, 1));
}

// Widest horizontal box of `height` that still lies inside the wedge, bisected
// against the wedge itself. Labels at 3 o'clock have plenty of chord but the
// box corners leave the sectors long before the chord runs out.
function labelWidthLimit(index, radius, height, pad) {
  const c = index * step();
  const ax = radius * Math.sin(c), ay = -radius * Math.cos(c);
  const hh = height / 2;
  const fits = w => {
    const hw = w / 2;
    for (const dx of [-hw, hw]) {
      for (const dy of [-hh, hh]) {
        if (!sliceContains(ax + dx, ay + dy, index, pad)) return false;
      }
    }
    return true;
  };
  let lo = 0;
  let hi = Math.min(2 * radius * Math.sin(Math.min(step(), Math.PI) / 2), 260);
  if (fits(hi)) return hi;
  for (let k = 0; k < 18; k++) {
    const mid = (lo + hi) / 2;
    if (fits(mid)) lo = mid; else hi = mid;
  }
  return lo;
}

// One size for every name on the page. Names used to shrink one by one until they fitted
// their wedge, which left the longest at half the size of its neighbours. Long names now
// wrap onto a second line at this same size; truncation is only the backstop.
const LABEL_MIN = 10;
const labelSize = () => Math.max(LABEL_MIN, R * (SLICES.length > 8 ? 0.066 : 0.072));
const LABEL_FACE = `700 {px} ${SERIF}`;

function layoutLabel(i, rr, size) {
  const font = LABEL_FACE.replace('{px}', size + 'px');
  const lineH = Math.ceil(size * 1.22);
  const cap = R * 0.60;
  const room = lines => Math.max(34, Math.min(labelWidthLimit(i, rr, lineH * lines, Math.min(7, R * 0.035)), cap));
  ctx.save();
  ctx.font = font;
  const wide = s => ctx.measureText(s).width;
  const title = SLICES[i].title;
  const one = room(1);
  let lines = [title], w = one;
  if (wide(title) > one) {
    const two = room(2);
    const words = title.split(' ');
    if (words.length > 1 && Math.max(...words.map(wide)) <= two) {
      // Greedy wrap into at most two lines; the second is cut with an ellipsis if it still overflows.
      let first = words[0], k = 1;
      while (k < words.length - 1 && wide(first + ' ' + words[k]) <= two) first += ' ' + words[k++];
      let second = words.slice(k).join(' ');
      while (second.length > 1 && wide(second) > two) second = second.slice(0, -2).trimEnd() + '…';
      lines = [first, second];
      w = two;
    } else {
      let t = title;
      while (t.length > 1 && wide(t) > one) t = t.slice(0, -2).trimEnd() + '…';
      lines = [t];
    }
  }
  ctx.restore();
  return { lines, lineH, width: w };
}

function drawLabels() {
  const z = R * P.top;
  const size = labelSize();
  for (let i = 0; i < SLICES.length; i++) {
    const a = i * step();
    const rr = R * P.labelR;
    const anchor = project(rr * Math.sin(a), -rr * Math.cos(a), z);
    const { lines, lineH } = layoutLabel(i, rr, size);
    lines.forEach((line, k) => {
      const dy = (k - (lines.length - 1) / 2) * lineH * anchor.s;
      text(line, { x: anchor.x, y: anchor.y + dy, s: anchor.s }, {
        size, font: SERIF, weight: '700', color: 'rgb(47,35,21)', halo: 'rgba(224,209,177,.78)'
      });
    });
  }
}

function drawNeedle() {
  const a = S.needle.value;
  const z = R * (P.top + 0.004);
  const len = R * 0.78, tail = R * 0.62, w = R * 0.026;

  const tip  = project(len * Math.sin(a), -len * Math.cos(a), z);
  const back = project(-tail * Math.sin(a), tail * Math.cos(a), z);
  const l    = project(-w * Math.cos(a), -w * Math.sin(a), z);
  const r    = project(w * Math.cos(a), w * Math.sin(a), z);

  ctx.save();
  ctx.translate(1.1, 1.5);
  tracePath([tip, l, back, r]);
  ctx.fillStyle = 'rgba(40,26,12,.30)';
  ctx.fill();
  ctx.restore();

  tracePath([tip, l, back, r]);
  const g = ctx.createLinearGradient(l.x, l.y, r.x, r.y);
  g.addColorStop(0, '#7e2a1f');
  g.addColorStop(0.5, C.vermilion);
  g.addColorStop(1, '#6c2318');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(52,18,12,.55)';
  ctx.lineWidth = 0.8;
  ctx.stroke();
}

function drawHub() {
  const r = R * P.hub;
  const h = Math.max(0, Math.min(1, S.hub.value));

  tracePath(ringPts(r, 80, project));
  const g = ctx.createRadialGradient(-r * 0.34, -r * 0.42, r * 0.05, 0, 0, r * 1.10);
  g.addColorStop(0, C.brassLit);
  g.addColorStop(0.34, C.brassMid);
  g.addColorStop(0.72, C.brassDark);
  g.addColorStop(1, C.brassDeep);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(38,26,12,.55)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const win = r * 0.56;
  tracePath(ringPts(win, 60, project));
  ctx.fillStyle = 'rgba(38,27,14,.92)';
  ctx.fill();
  tracePath(ringPts(win, 60, project));
  ctx.strokeStyle = `rgba(250,238,208,${0.10 + 0.20 * h})`;
  ctx.lineWidth = 1;
  ctx.stroke();

  text(hoveredSlice === null ? '–' : '0' + (hoveredSlice + 1), { x: 0, y: 1, s: 1 }, {
    size: r * 0.58, font: MONO, weight: '600', color: C.brassHi
  });

  ctx.beginPath();
  ctx.arc(0, 0, R * 0.018, 0, TAU);
  ctx.fillStyle = 'rgba(250,240,214,.55)';
  ctx.fill();
}

// ── Compose ────────────────────────────────────────────────────────────────
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(O.x, O.y);

  drawBackdrop();

  const open = Math.max(0, Math.min(1, S.open.value));
  if (open < 0.002) { ctx.restore(); return; }

  ctx.scale(0.94 + 0.06 * open, 0.94 + 0.06 * open);

  drawContactShadow();
  drawCaseWall();
  drawLug();
  drawBrass();
  drawCard();
  drawCardPrinting();
  drawSectorWash();
  drawNeedle();
  drawLabels();
  drawHub();
  // Last: shut it lies just above the card, and mid-swing its lower half passes
  // in front of the card's near edge. Its shadow goes down first, on everything printed on
  // the case top, and the barrel goes over it, because the barrel is what the lid hangs from.
  drawLidShadow();
  drawLidCastShadow();
  drawLid();
  drawHinge();

  ctx.restore();
}

function aim() {
  const dx = pointer.x - O.x, dy = pointer.y - O.y;
  const d = Math.hypot(dx, dy);
  const reach = R * 1.05;
  if (d < 1) { S.pitch.target = 0; S.roll.target = 0; return; }
  const t = Math.min(1, d / reach);
  const strength = (11 * Math.PI / 180) * (t * t * (3 - 2 * t));
  S.pitch.target = strength * (dy / d);
  S.roll.target = -strength * (dx / d);
}

function hitTest() {
  const dx = pointer.x - O.x, dy = pointer.y - O.y;
  const d = Math.hypot(dx, dy);
  if (d <= R * P.hub) return -2;
  if (d > R * P.sectorOut) return -1;
  return Math.round(norm(Math.atan2(dx, -dy)) / step()) % SLICES.length;
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  R = RADIUS_OVERRIDE || Math.min(190, Math.min(W, H) * 0.155);
  O = { x: W / 2, y: H / 2 + R * 0.42 };
  if (!grain) buildGrain();
}

let last = performance.now();
let started = false;

function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;

  if (!started) {
    started = true;
    // With no freeze requested, replay `RadialMenuView.present()` exactly: both springs start
    // at rest and are kicked, so what is judged here is the gesture the app actually plays.
    // Starting open at 0.30 with no kick (what this used to do) hid the stutter being fixed.
    S.open.value = 0; S.open.target = 1;
    HINGE.angle = 0; HINGE.velocity = 0; HINGE.release();
    S.needle.value = 0;
    if (FREEZE !== null) { S.open.value = 1; HINGE.angle = HINGE.stop; HINGE.velocity = 0; HINGE.mode = 'rest'; }
    else { S.open.velocity = OPEN_KICK; }

    if (CLOSE_AT_MS !== null) {
      S.open.value = 1; S.open.target = 0; S.open.velocity = 0;
      HINGE.angle = HINGE.stop; HINGE.velocity = 0; HINGE.mode = 'rest';
      HINGE.shut();
      const n = Math.round(CLOSE_AT_MS / 1000 * 240);
      for (let i = 0; i < n; i++) { S.open.step(1 / 240); HINGE.step(1 / 240); }
      S.open.velocity = 0; S.open.target = S.open.value; HINGE.frozen = true;
    }

    // `?at=ms` advances the gesture by that much at a fixed 240Hz and then holds it still, so a
    // single frame of the real open can be captured. Stepping a fixed dt rather than sampling
    // the clock makes the frame reproducible; it is the same integrator either way.
    if (AT_MS !== null) {
      const n = Math.round(AT_MS / 1000 * 240);
      for (let i = 0; i < n; i++) {
        S.open.step(1 / 240); HINGE.step(1 / 240);
        if (HINGE.impact > 0) S.pitch.velocity += HINGE.impact * IMPACT_TILT;
        S.pitch.step(1 / 240); S.roll.step(1 / 240); S.needle.step(1 / 240); S.hub.step(1 / 240);
      }
      S.open.velocity = 0; S.open.target = S.open.value;
      HINGE.frozen = true;
    }
  }

  aim();
  [S.open, S.pitch, S.roll, S.needle, S.hub].forEach(s => s.step(dt));
  HINGE.step(dt);
  if (HINGE.impact > 0) S.pitch.velocity += HINGE.impact * IMPACT_TILT;
  S.hover.forEach(s => s.step(dt));

  lidAngle = FREEZE !== null
    ? FREEZE * Math.PI / 180
    : HINGE.angle;

  const hit = hitTest();
  hoveredSlice = hit >= 0 ? hit : null;
  S.hover.forEach((s, i) => { s.target = i === hoveredSlice ? 1 : 0; });
  S.hub.target = hit === -2 ? 1 : 0;
  if (hoveredSlice !== null) S.needle.target = hoveredSlice * step();

  draw();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
window.addEventListener('pointermove', e => { pointer = { x: e.clientX, y: e.clientY }; });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { S.open.target = 0; HINGE.shut(); }
  if (/^[1-9]$/.test(e.key)) S.needle.target = (parseInt(e.key, 10) - 1) * step();
});

resize();
pointer = { x: W / 2 + R * 0.55, y: H / 2 - R * 0.10 };
requestAnimationFrame(frame);
</script>
</body>
</html>
