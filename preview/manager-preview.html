<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lodestar — manager redesign (phase 0)</title>
<style>
  /* Phase 0 look-dev for the redesigned manager window.
     Tokens mirror Sources/Lodestar/Palette.swift and CompassTheme.swift (the brass/leather
     language), so what is approved here is what gets ported to SwiftUI. Nothing in this file
     ships; it exists so the look and the motion can be reviewed without a Mac.
     Query params: ?tab=dial|library|import|settings  ?nolid  ?hover=N  ?compose  ?palette  ?edit */
  :root {
    --void: #1A1410; --void-raised: #241C16; --hull: #2A211A; --hull-lift: #352A21;
    --rim: rgba(240,229,205,.10); --rim-strong: rgba(240,229,205,.24);
    --bone: #F0E5CD; --bone-dim: rgba(240,229,205,.62); --bone-faint: rgba(240,229,205,.50);
    --signal: #D97B46; --signal-ink: #201912; --mint: #8FBFA3; --alarm: #E0817A;
    --brass-hi: #D5C08F; --brass-lit: #B39257; --brass-mid: #856636; --brass-dark: #5A4325; --brass-deep: #2F2717;
    --paper: #DCCDAA; --paper-lit: #E0D1B1; --paper-deep: #BDA87E; --paper-edge: #87704A;
    --ink: #33261A; --ink-subtle: #493B28; --vermilion: #8F3222; --vermilion-lit: #B4452E;
    --serif: "Baskerville", "Libre Baskerville", "Baskerville Old Face", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --spring-soft: cubic-bezier(.22, 1.25, .36, 1);
    --out: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0A0705; color: var(--bone); font-family: var(--serif);
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  input { font: inherit; color: inherit; }
  ::placeholder { color: var(--bone-dim); }

  .stage { position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(900px 600px at 50% 40%, #1d150f, #0A0705 70%); }
  .scaler { width: 1040px; height: 720px; transform-origin: center; }
  .note { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; font: 11px var(--mono);
    color: rgba(240,229,205,.32); letter-spacing: .03em; }

  /* ───────── Window ───────── */
  .window { position: relative; width: 1040px; height: 720px; border-radius: 14px; overflow: hidden;
    background: var(--void);
    box-shadow: 0 0 0 1px rgba(240,229,205,.10), 0 40px 90px rgba(0,0,0,.65), 0 12px 30px rgba(0,0,0,.5);
    isolation: isolate; }
  /* Leather: fine noise plus a pool of warm light that follows the cursor. */
  .window::before { content: ""; position: absolute; inset: 0; z-index: -2; opacity: .55; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .spot { position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(520px 420px at var(--mx, 50%) var(--my, 30%), rgba(217,123,70,.13), transparent 70%),
      radial-gradient(1200px 800px at 50% -10%, rgba(179,146,87,.07), transparent 60%),
      radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.45) 100%); }
  .titlebar { position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 30; pointer-events: none; display: flex; align-items: center; padding-left: 18px; gap: 8px; }
  .titlebar i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.35); }
  .titlebar i:nth-child(1) { background: #ff5f57; } .titlebar i:nth-child(2) { background: #febc2e; } .titlebar i:nth-child(3) { background: #28c840; }

  /* ───────── Tab bar: a brass pill with a sliding lit plate ───────── */
  .tabs { position: absolute; z-index: 20; top: 22px; left: 50%; transform: translateX(-50%); display: flex; padding: 5px; gap: 2px;
    border-radius: 999px; background: linear-gradient(180deg, #2f251d, #221a14);
    box-shadow: inset 0 1px 0 rgba(240,229,205,.10), inset 0 -1px 0 rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(240,229,205,.08); }
  .tabs button { position: relative; z-index: 1; padding: 9px 22px; border-radius: 999px; font-size: 15px; font-weight: 600; letter-spacing: .01em;
    color: var(--bone-dim); transition: color .25s, transform .3s var(--spring); }
  .tabs button:hover { color: var(--bone); transform: translateY(-1px); }
  .tabs button:active { transform: translateY(1px) scale(.97); }
  .tabs button[aria-selected="true"] { color: var(--signal-ink); }
  .tabs .plate { position: absolute; z-index: 0; top: 5px; bottom: 5px; left: 0; width: 80px; border-radius: 999px; overflow: hidden;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass-lit) 55%, #9c7d46);
    box-shadow: 0 2px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,245,215,.55), inset 0 -1px 0 rgba(60,40,10,.5);
    transition: transform .55s var(--spring-soft), width .55s var(--spring-soft); }
  .tabs .plate::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.45) 48%, transparent 62%);
    transform: translateX(-120%); }
  .tabs .plate.flash::after { animation: sweep .8s var(--out); }
  @keyframes sweep { to { transform: translateX(120%); } }

  /* ───────── Views ───────── */
  main { position: absolute; inset: 0; perspective: 1600px; }
  .view { position: absolute; inset: 0; padding: 104px 56px 56px; visibility: hidden; opacity: 0; pointer-events: none; }
  .view.active { visibility: visible; opacity: 1; pointer-events: auto; animation: viewIn .7s var(--out) both; }
  .view.leaving { visibility: visible; animation: viewOut .22s ease-in both; pointer-events: none; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(26px) rotateX(7deg) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes viewOut { to { opacity: 0; transform: translateY(-12px) rotateX(-4deg) scale(.99); } }
  .eyebrow { font: 600 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--bone-faint); }
  h1 { margin: 0; font-weight: 600; letter-spacing: -.02em; line-height: 1.04; }

  /* ───────── Dial ───────── */
  #view-dial { display: grid; grid-template-columns: 1fr 520px; align-items: center; gap: 24px; padding-right: 40px; padding-left: 64px; }
  .dial-copy { align-self: center; padding-bottom: 20px; }
  .titleblock { min-height: 168px; margin-top: 18px; }
  .dial-copy h1 { font-size: 58px; margin: 0 0 14px; }
  .dial-copy h1 em { font-style: italic; color: var(--signal); }
  .dial-copy .host { font: 14px var(--mono); color: var(--bone-dim); letter-spacing: .01em; min-height: 20px; }
  .swap { animation: swap .5s var(--out) both; }
  @keyframes swap { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  .dial-actions { display: flex; gap: 10px; margin-top: 30px; min-height: 40px; }
  .dial-foot { display: flex; align-items: center; gap: 14px; margin-top: 56px; color: var(--bone-faint); font-size: 14px; }
  .keys { display: flex; gap: 6px; }
  .key { display: inline-grid; place-items: center; min-width: 38px; height: 38px; padding: 0 10px; border-radius: 9px; font: 600 15px var(--mono); color: var(--bone);
    background: linear-gradient(180deg, #3a2e24, #2a2119); box-shadow: 0 4px 0 #120d09, 0 6px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(240,229,205,.14);
    transition: transform .12s, box-shadow .12s, color .15s; user-select: none; }
  .key.down { transform: translateY(4px); box-shadow: 0 0 0 #120d09, 0 1px 3px rgba(0,0,0,.4), inset 0 1px 0 rgba(240,229,205,.06); color: var(--signal); }
  .pager { display: flex; align-items: center; gap: 10px; margin-top: 18px; font: 12px var(--mono); color: var(--bone-faint); }
  .pager .dots { display: flex; gap: 6px; }
  .pager .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--rim-strong); transition: all .4s var(--spring); }
  .pager .dots i.on { background: var(--signal); transform: scale(1.35); box-shadow: 0 0 10px rgba(217,123,70,.7); }
  .pager button { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--hull); box-shadow: 0 0 0 1px var(--rim);
    transition: transform .3s var(--spring), background .2s; }
  .pager button:hover { background: var(--hull-lift); transform: scale(1.1); } .pager button:active { transform: scale(.92); }
  .pager button:disabled { opacity: .3; pointer-events: none; }

  /* Buttons */
  .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: 600;
    background: var(--hull); box-shadow: 0 0 0 1px var(--rim), 0 2px 6px rgba(0,0,0,.3); transition: transform .3s var(--spring), background .2s, box-shadow .2s; }
  .btn:hover { background: var(--hull-lift); transform: translateY(-2px); box-shadow: 0 0 0 1px var(--rim-strong), 0 8px 18px rgba(0,0,0,.4); }
  .btn:active { transform: translateY(1px) scale(.96); }
  .btn.signal { color: var(--signal-ink); background: linear-gradient(180deg, #e68c58, var(--signal)); box-shadow: 0 6px 18px rgba(217,123,70,.28), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.signal:hover { box-shadow: 0 10px 28px rgba(217,123,70,.45), inset 0 1px 0 rgba(255,255,255,.4); background: linear-gradient(180deg, #ee9a68, #e07e48); }
  .btn.danger:hover { color: var(--alarm); }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .btn svg, .ico svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sheen::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;
    background: radial-gradient(160px circle at var(--px, 50%) var(--py, 50%), rgba(255,240,205,.28), transparent 60%); mix-blend-mode: soft-light; }
  .sheen:hover::before { opacity: 1; }
  .ripple-dot { position: absolute; border-radius: 50%; pointer-events: none; background: rgba(255,240,205,.5); transform: translate(-50%,-50%) scale(0); animation: ripple .65s var(--out) forwards; }
  @keyframes ripple { to { transform: translate(-50%,-50%) scale(1); opacity: 0; } }

  /* ───────── The 3D compass ───────── */
  .cmp-wrap { position: relative; width: 520px; height: 520px; perspective: 1500px; }
  .cmp { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(var(--rx, 14deg)) rotateY(var(--ry, 0deg)); will-change: transform; }
  .cmp .l { position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none; }
  .l-shadow { width: 470px; height: 470px; margin: -235px 0 0 -235px; background: radial-gradient(circle, rgba(0,0,0,.75), rgba(0,0,0,0) 68%); filter: blur(14px);
    transform: translate3d(var(--sx, 0px), calc(var(--sy, 0px) + 36px), -90px) scale(1.06); }
  .l-case { width: 470px; height: 470px; margin: -235px 0 0 -235px;
    background:
      radial-gradient(circle, transparent 0 207px, rgba(0,0,0,.5) 208px, transparent 214px),
      conic-gradient(from calc(var(--la, 30) * 1deg), #D5C08F, #856636 12%, #5A4325 24%, #B39257 38%, #E3D2A2 48%, #856636 60%, #4a381f 74%, #A98A52 88%, #D5C08F);
    box-shadow: 0 0 0 1.5px #2F2717, inset 0 0 0 3px rgba(255,240,200,.25), inset 0 -8px 18px rgba(30,20,5,.55), inset 0 6px 10px rgba(255,235,185,.28); }
  /* Knurled rim: a fine repeating conic reads as machined edge. */
  .l-case::after { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: .5; mix-blend-mode: multiply;
    background: repeating-conic-gradient(rgba(0,0,0,.35) 0 .5deg, transparent .5deg 2.5deg);
    -webkit-mask: radial-gradient(circle, transparent 0 222px, #000 223px); mask: radial-gradient(circle, transparent 0 222px, #000 223px); }
  .l-bezel { width: 424px; height: 424px; margin: -212px 0 0 -212px; transform: translateZ(6px);
    background: radial-gradient(circle, transparent 0 201px, rgba(20,12,4,.8) 206px, rgba(255,235,185,.35) 210px, transparent 212px);
    box-shadow: inset 0 0 22px rgba(0,0,0,.55); }
  svg.l { width: 520px; height: 520px; margin: -260px 0 0 -260px; overflow: visible; }
  .l-card { pointer-events: auto !important; transform: translateZ(12px); }
  .l-needle { transform: translateZ(34px); } .l-hub { transform: translateZ(46px); }
  .l-hub { width: 78px; height: 78px; margin: -39px 0 0 -39px; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #E3D2A2, #B39257 35%, #856636 65%, #4a381f);
    box-shadow: 0 8px 14px rgba(0,0,0,.55), 0 0 0 1.5px #2F2717, inset 0 -3px 5px rgba(30,20,5,.5), inset 0 2px 3px rgba(255,240,200,.5); }
  .l-hub b { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 20px var(--mono); color: #EDE0BF;
    background: radial-gradient(circle at 50% 30%, #3b2b1a, #2e2113); box-shadow: inset 0 2px 5px rgba(0,0,0,.7), 0 0 0 1.5px rgba(255,235,185,.4); }
  .l-glass { width: 424px; height: 424px; margin: -212px 0 0 -212px; transform: translateZ(60px); mix-blend-mode: screen;
    background: radial-gradient(circle at var(--gx, 34%) var(--gy, 24%), rgba(255,244,220,.30), rgba(255,244,220,.06) 34%, transparent 58%),
                linear-gradient(135deg, rgba(255,255,255,.10), transparent 40%); }
  .l-lid { width: 470px; height: 470px; margin: -235px 0 0 -235px; transform-origin: 50% 0%; transform: translateZ(80px); z-index: 5;
    background: conic-gradient(from 40deg, #B39257, #856636 18%, #D5C08F 34%, #6a5129 52%, #B39257 70%, #E3D2A2 82%, #B39257);
    box-shadow: inset 0 0 0 6px rgba(255,240,200,.22), inset 0 0 40px rgba(30,20,5,.5), 0 20px 40px rgba(0,0,0,.55); }
  .l-lid::before { content: ""; position: absolute; inset: 36px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(47,39,23,.55), 0 0 0 1px rgba(255,240,200,.25);
    background: repeating-conic-gradient(rgba(47,39,23,.25) 0 1deg, transparent 1deg 10deg); }
  .l-lid::after { content: ""; position: absolute; inset: 120px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #D5C08F, #856636 70%); box-shadow: inset 0 0 0 2px rgba(47,39,23,.6); }
  .l-lid.gone { display: none; }
  .l-lid.open { animation: lid 1.25s cubic-bezier(.5, 0, .2, 1) .15s forwards; }
  @keyframes lid { 0% { transform: translateZ(80px) rotateX(0); opacity: 1; } 78% { opacity: 1; } 100% { transform: translateZ(80px) rotateX(-118deg); opacity: 0; visibility: hidden; } }

  .wedge { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .45s var(--spring), filter .3s;
    transform: translate(0,0) scale(1); }
  .wedge path { fill: rgba(51,38,26,.07); stroke: rgba(51,38,26,.30); stroke-width: 1; transition: fill .3s, stroke .3s; }
  .wedge:hover { transform: translate(calc(var(--dx) * 1px), calc(var(--dy) * 1px)) scale(1.035); filter: drop-shadow(0 6px 5px rgba(40,25,10,.4)); }
  .wedge:hover path, .wedge.aimed path { fill: rgba(143,50,34,.20); stroke: rgba(143,50,34,.95); stroke-width: 1.4; }
  .wedge.aimed path { fill: rgba(143,50,34,.26); }
  .wedge .num { font: 700 12px var(--mono); fill: var(--ink-subtle); } .wedge .name { font: 600 13.5px var(--serif); fill: var(--ink); }
  .wedge:hover .num, .wedge.aimed .num { fill: var(--vermilion); }
  .wedge.empty path { stroke-dasharray: 4 5; fill: transparent; }
  .wedge.empty .plus { opacity: .45; transition: opacity .3s, transform .4s var(--spring); transform-box: fill-box; transform-origin: center; }
  .wedge.empty:hover .plus { opacity: 1; transform: rotate(90deg) scale(1.2); }
  .wedge.dropin { animation: dropin .85s var(--spring) both; }
  @keyframes dropin { 0% { transform: translateY(-34px) scale(1.25); opacity: 0; filter: drop-shadow(0 24px 12px rgba(0,0,0,.5)); } 60% { opacity: 1; } 100% { transform: none; filter: none; } }
  .wedge.dragging { opacity: .35; }
  .wedge.dragover path { fill: rgba(217,123,70,.35); stroke: var(--vermilion-lit); stroke-width: 2; }
  .cmp-wrap.mini .wedge { cursor: default; pointer-events: none; }

  /* ───────── Library ───────── */
  .lib-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 26px; }
  .lib-head h1 { font-size: 46px; margin-top: 10px; }
  .search { position: relative; display: flex; align-items: center; gap: 10px; width: 290px; height: 44px; padding: 0 14px; border-radius: 12px; background: var(--hull);
    box-shadow: 0 0 0 1px var(--rim); transition: width .5s var(--spring-soft), box-shadow .25s, background .25s; }
  .search:focus-within { width: 360px; background: var(--hull-lift); box-shadow: 0 0 0 1.5px var(--signal), 0 0 24px rgba(217,123,70,.2); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; }
  .search svg { width: 17px; height: 17px; stroke: var(--bone-dim); fill: none; stroke-width: 1.8; stroke-linecap: round; }
  .list { height: 470px; overflow-y: auto; margin: 0 -56px; padding: 6px 56px 40px; scrollbar-width: none;
    -webkit-mask: linear-gradient(transparent, #000 14px, #000 calc(100% - 34px), transparent); mask: linear-gradient(transparent, #000 14px, #000 calc(100% - 34px), transparent); }
  .list::-webkit-scrollbar { display: none; }
  .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0 10px; font: 600 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--bone-faint); }
  .divider:first-child { margin-top: 4px; } .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--rim-strong), transparent); }
  .row { position: relative; display: flex; align-items: center; gap: 20px; height: 68px; padding: 0 18px 0 14px; margin-bottom: 6px; border-radius: 16px;
    background: transparent; transition: transform .4s var(--spring), background .25s, box-shadow .3s; }
  .row::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--signal); transform: scaleY(0); transition: transform .4s var(--spring); }
  .row:hover { transform: translateY(-2px) scale(1.006); background: linear-gradient(90deg, rgba(217,123,70,.12), rgba(42,33,26,.85) 40%); box-shadow: 0 14px 30px rgba(0,0,0,.4), 0 0 0 1px var(--rim); }
  .row:hover::before { transform: scaleY(1); }
  .row.dragging { opacity: .35; } .row.removing { opacity: 0; transform: translateX(40px) scale(.96); transition: all .35s ease-in; }
  .slot { position: relative; width: 38px; height: 38px; flex: none; display: grid; place-items: center; font: 600 12px var(--mono); color: var(--bone-dim); }
  .slot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .row:hover .slot { color: var(--bone); }
  .mono-tile { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; font: 700 20px var(--serif); color: var(--signal-ink);
    background: linear-gradient(145deg, var(--brass-hi), var(--brass-lit) 55%, var(--brass-mid)); box-shadow: inset 0 1px 0 rgba(255,245,215,.6), inset 0 -2px 4px rgba(60,40,10,.4), 0 3px 8px rgba(0,0,0,.4);
    transition: transform .45s var(--spring); }
  .row:hover .mono-tile { transform: rotate(-6deg) scale(1.08); }
  .row .t { flex: 1; min-width: 0; } .row .t b { display: block; font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { display: block; margin-top: 3px; font: 12.5px var(--mono); color: var(--bone-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .acts { display: flex; gap: 4px; opacity: 0; transform: translateX(10px); transition: opacity .2s, transform .35s var(--spring); }
  .row:hover .acts, .row:focus-within .acts { opacity: 1; transform: none; }
  .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--bone-dim); transition: background .2s, color .2s, transform .3s var(--spring); }
  .ico:hover { background: rgba(240,229,205,.10); color: var(--bone); transform: scale(1.12); } .ico:active { transform: scale(.88); }
  .grip { color: var(--bone-faint); opacity: 0; cursor: grab; transition: opacity .2s; } .row:hover .grip { opacity: .7; }
  .menu { position: absolute; right: 12px; top: 52px; z-index: 40; min-width: 190px; padding: 6px; border-radius: 12px; background: #241c16;
    box-shadow: 0 0 0 1px var(--rim-strong), 0 20px 50px rgba(0,0,0,.6); animation: pop .35s var(--spring) both; transform-origin: top right; }
  .menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; font-size: 15px; transition: background .15s; }
  .menu button:hover { background: rgba(240,229,205,.10); } .menu .danger { color: var(--alarm); }
  @keyframes pop { from { opacity: 0; transform: scale(.88) translateY(-6px); } to { opacity: 1; transform: none; } }

  /* ───────── Import ───────── */
  #view-import { display: grid; place-items: center; text-align: center; padding-top: 92px; }
  .imp { width: 520px; }
  .lock { width: 120px; height: 120px; margin: 0 auto 22px; position: relative; filter: drop-shadow(0 16px 20px rgba(0,0,0,.5)); }
  .lock svg { width: 100%; height: 100%; overflow: visible; }
  .lock .shackle { transform-box: fill-box; transform-origin: 0% 100%; transition: transform .8s var(--spring); }
  .lock.open .shackle { transform: translateY(-4px) rotate(-26deg); }

  <div class="card"><h3>Opening links</h3><div class="line"><span>Open in</span>${seg('openIn', ['New tab', 'Current tab', 'New window'], s.openIn)}</div>
    <div class="line"><div>Keep the current tab focused<small>Open in the background.</small></div>${tog('background')}</div></div>
  <div class="card"><h3>The dial</h3><div class="line"><span>Size</span><div style="display:flex;gap:14px;align-items:center"><input type="range" id="radius" min="140" max="260" value="${s.radius}" style="--v:${(s.radius - 140) / 1.2}%"><span style="font:14px var(--mono);width:34px;color:var(--bone-dim)">${s.radius}</span></div></div>
    <div class="line"><div>Show slot numbers<small>On every wedge.</small></div>${tog('numbers')}</div></div>
  <div class="card"><h3>Startup</h3><div class="line"><span>Launch at login</span>${tog('login')}</div><div class="line"><div>Re-read Safari on launch<small>Needs Full Disk Access.</small></div>${tog('sync')}</div></div>
  <div class="card"><h3>About</h3><div class="line" style="font-size:15px;color:var(--bone-dim)">Nine slots per page · 1–9 opens · ← → turns the page · Esc closes</div></div>`;
  $('#settings').scrollTop = keep; seg_init(); applyPreview();
}
function seg_init() { $$('.seg').forEach(sg => { const on = $('button.on', sg), i = $('i', sg); i.style.left = on.offsetLeft + 'px'; i.style.width = on.offsetWidth + 'px'; }); }
function applyPreview() { const s = S.settings; $('#cmp-prev').style.setProperty('--scale', (.42 + (s.radius - 140) / 120 * .22).toFixed(3)); if (prev.showNumbers !== s.numbers) { prev.showNumbers = s.numbers; prev.draw(); } }
$('#settings').addEventListener('click', e => {
  const sg = e.target.closest('[data-seg]'), t = e.target.closest('[data-tog]');
  if (sg && e.target.dataset.v != null) { S.settings.openIn = +e.target.dataset.v; $$('button', sg).forEach(b => b.classList.toggle('on', b === e.target)); seg_init(); }
  if (t) { const k = t.dataset.tog; S.settings[k] = !S.settings[k]; t.classList.toggle('on', S.settings[k]); t.setAttribute('aria-checked', S.settings[k]); if (k === 'numbers') { applyPreview(); main.showNumbers = S.settings.numbers; main.draw(); } }
  if (e.target.closest('#rec')) { recording = !recording; renderSettings(); }
});
$('#settings').addEventListener('input', e => { if (e.target.id === 'radius') { S.settings.radius = +e.target.value; e.target.style.setProperty('--v', (S.settings.radius - 140) / 1.2 + '%'); e.target.nextElementSibling.textContent = S.settings.radius; applyPreview(); } });

/* ───────── Composer ───────── */
const fab = $('#fab'); let composing = false;
const clip = $('#clip');
function openComposer() { if (composing) return; composing = true; fab.classList.add('open'); setTimeout(() => $('#c-url').focus(), 380); if (!clipUsed) clip.classList.add('show'); }
function closeComposer() { composing = false; fab.classList.remove('open'); clip.classList.remove('show'); $('#c-err').textContent = ''; document.activeElement?.blur?.(); }
let clipUsed = false;
fab.addEventListener('click', e => { if (!composing) openComposer(); else if (e.target.closest('#fab-plus')) closeComposer(); });
clip.addEventListener('click', () => { clipUsed = true; $('#c-url').value = 'docs.swift.org'; $('#c-name').value = 'Swift Docs'; clip.classList.remove('show'); $('#c-url').focus(); });
$('#compose').addEventListener('submit', e => {
  e.preventDefault(); let u = $('#c-url').value.trim(); if (!u) return;
  if (!/^[\w.-]+\.[a-z]{2,}|^\d+\.\d+\.\d+\.\d+|^https?:\/\//i.test(u)) { $('#c-err').textContent = 'That doesn’t look like a web address.'; return; }
  $('#c-err').textContent = ''; const name = $('#c-name').value.trim() || (hostOf(u).replace(/^www\./, '').split('.')[0].replace(/^./, c => c.toUpperCase()));
  const it = mk(name, hostOf(u)); S.items.push(it); S.aimed = S.items.length - 1; main.page = pageOf(S.aimed); main.dropId = it.id;
  $('#c-name').value = ''; $('#c-url').value = ''; closeComposer(); setTab('dial'); renderAll(); toast(`<i>✓</i> ${esc(name)} → slot ${S.aimed + 1}`);
});

/* ───────── Edit sheet ───────── */
let editing = null;
function openEdit(it) { editing = it; $('#e-name').value = it.title; $('#e-url').value = it.url; $('#edit').classList.add('show'); setTimeout(() => $('#e-name').select(), 120); }
const closeEdit = () => { $('#edit').classList.remove('show'); editing = null; };
$('#e-cancel').onclick = closeEdit; $('#edit').addEventListener('pointerdown', e => { if (e.target.id === 'edit') closeEdit(); });
$('#edit-form').addEventListener('submit', e => { e.preventDefault(); if (!editing) return; editing.title = $('#e-name').value.trim() || editing.title; editing.url = hostOf($('#e-url').value.trim() || editing.url); closeEdit(); renderAll(); toast('<i>✓</i> Saved'); });

/* ───────── Command palette ───────── */
let palSel = 0, palRows = [];
function palBuild() {
  const q = $('#pal-q').value.toLowerCase();
  const cmds = [['Go to Dial', '', () => setTab('dial')], ['Go to Library', '', () => setTab('library')], ['Import from Safari', '', () => setTab('import')], ['Settings', '⌘,', () => setTab('settings')], ['Add bookmark', '⌘N', () => openComposer()]];
  palRows = [...cmds.map(([t, k, f]) => ({ t, k, f })), ...S.items.map((it, i) => ({ t: it.title, k: `slot ${i + 1}`, f: () => { setTab('dial'); main.aimAt(i); } }))].filter(r => r.t.toLowerCase().includes(q)).slice(0, 8);
  palSel = clamp(palSel, 0, Math.max(0, palRows.length - 1));
  $('#pal-list').innerHTML = palRows.map((r, i) => `<li class="${i === palSel ? 'sel' : ''}" data-i="${i}">${esc(r.t)}<small>${esc(r.k)}</small></li>`).join('');
}
const openPal = () => { $('#pal').classList.add('show'); $('#pal-q').value = ''; palSel = 0; palBuild(); setTimeout(() => $('#pal-q').focus(), 60); };
const closePal = () => $('#pal').classList.remove('show');
$('#pal-q').addEventListener('input', () => { palSel = 0; palBuild(); });
$('#pal-q').addEventListener('keydown', e => { if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palRows.length - 1); palBuild(); e.preventDefault(); } if (e.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); palBuild(); e.preventDefault(); }
  if (e.key === 'Enter') { const r = palRows[palSel]; closePal(); r && setTimeout(r.f, 120); } });
$('#pal-list').addEventListener('click', e => { const li = e.target.closest('li'); if (li) { const r = palRows[+li.dataset.i]; closePal(); setTimeout(r.f, 120); } });
$('#pal').addEventListener('pointerdown', e => { if (e.target.id === 'pal') closePal(); });

/* ───────── Tabs ───────── */
const TABS = ['dial', 'library', 'import', 'settings'];
function movePlate(animate = true) {
  const b = $(`#tabs button[data-tab="${S.tab}"]`), plate = $('#plate'); if (!b) return;
  if (!animate) plate.style.transition = 'none'; plate.style.width = b.offsetWidth + 'px'; plate.style.transform = `translateX(${b.offsetLeft}px)`;
  if (!animate) { void plate.offsetWidth; plate.style.transition = ''; } else { plate.classList.remove('flash'); void plate.offsetWidth; plate.classList.add('flash'); }
}
function setTab(t, first) {
  if (t === S.tab && !first) return; const prevView = $(`#view-${S.tab}`); S.tab = t;
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t)); movePlate(!first);
  if (!first && prevView) { prevView.classList.remove('active'); prevView.classList.add('leaving'); setTimeout(() => prevView.classList.remove('leaving'), 230); }
  const v = $(`#view-${t}`); v.classList.remove('leaving'); void v.offsetWidth; v.classList.add('active');
  if (t === 'dial') { main.setPage(pageOf(S.aimed)); renderDial(); } if (t === 'settings') { renderSettings(); } if (t === 'import') renderImport(); if (t === 'library') renderLibrary();
  fab.style.opacity = t === 'settings' || t === 'import' ? '0' : '1'; fab.style.pointerEvents = t === 'settings' || t === 'import' ? 'none' : ''; if (t === 'settings' || t === 'import') closeComposer();
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });
function renderAll(only) { const r = { dial: () => { main.draw(); renderDial(); }, library: renderLibrary, import: renderImport, settings: () => { if (S.tab === 'settings') renderSettings(); } };
  (only || Object.keys(r)).forEach(k => r[k]()); }

/* ───────── Keyboard ───────── */
const typing = () => /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');
addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (recording) { e.preventDefault(); if (!['Meta', 'Control', 'Shift', 'Alt'].includes(e.key)) { S.settings.hotkey = [e.metaKey ? '⌘' : e.ctrlKey ? '⌃' : '', e.altKey ? '⌥' : '', e.shiftKey ? '⇧' : '', e.key.toUpperCase()].filter(Boolean); recording = false; renderSettings(); } return; }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#pal').classList.contains('show') ? closePal() : openPal(); return; }
  if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); setTab('dial'); openComposer(); return; }
  if (mod && e.key === ',') { e.preventDefault(); setTab('settings'); return; }
  if (e.key.toLowerCase() === 'e' && (mod || !typing())) { e.preventDefault(); $$('#hotkey .key').forEach(k => k.classList.add('down')); setTimeout(() => $$('#hotkey .key').forEach(k => k.classList.remove('down')), 220); return; }
  if (e.key === 'Escape') { if ($('#pal').classList.contains('show')) closePal(); else if ($('#edit').classList.contains('show')) closeEdit(); else if (composing) closeComposer(); return; }
  if (typing() || mod) return;
  if (e.key.toLowerCase() === 'r') { reset(); main.page = 0; S.imp = 'locked'; renderAll(); setTab('dial'); toast('<i>↺</i> Demo reset'); }
  if (e.key.toLowerCase() === 'l') { setTab('dial'); main.openLid(); }
  if (S.tab === 'dial') {
    if (/^[1-9]$/.test(e.key)) { const i = main.page * PER_PAGE + +e.key - 1; main.aimAt(i); const it = S.items[i]; it ? toast(`<i>↗</i> Opening ${esc(hostOf(it.url))}`) : openComposer(); }
    if (e.key === 'ArrowRight') goPage(main.page + 1); if (e.key === 'ArrowLeft') goPage(main.page - 1);
  }
});

/* ───────── Boot ───────── */
const start = Q.get('tab') || 'dial';
S.tab = '__'; setTab(TABS.includes(start) ? start : 'dial', true);
if (Q.has('hover')) { S.aimed = clamp(+Q.get('hover') - 1, 0, S.items.length - 1); main.mark(); renderDial(); }
main.draw(); renderDial(); renderLibrary(); renderImport(); prev.draw();
if (!Q.has('nolid') && !REDUCED && S.tab === 'dial') main.openLid(); else { $('.l-lid', main.el)?.classList.add('gone'); main.mark(); }
if (Q.has('compose')) openComposer(); if (Q.has('palette')) openPal(); if (Q.has('edit')) openEdit(S.items[1]);
if (Q.get('import')) { S.imp = Q.get('import'); renderImport(); }
document.fonts?.ready.then(() => movePlate(false));
movePlate(false);
})();
</script>
</body>
</html>
